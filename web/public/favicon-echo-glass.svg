<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser-tab icon: the small (< 24 px) Echo Glass cut, no echoes or glint,
       thick outline. Ink flips dark on light browser chrome. Master: logo-echo-glass.svg. -->
  <style>
    .ink { stroke: #f2f3f5; }
    .lens { fill: #f2f3f5; }
    @media (prefers-color-scheme: light) {
      .ink { stroke: #08090a; }
      .lens { fill: #08090a; }
    }
  </style>
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
      <rect width="48" height="48" fill="#fff"/>
      <polygon points="12,24 18,17.5 30,17.5 36,24 30,30.5 18,30.5" fill="#000" stroke="#000" stroke-width="3.2" stroke-linejoin="bevel"/>
    </mask>
    <clipPath id="lens">
      <polygon points="12,24 18,17.5 30,17.5 36,24 30,30.5 18,30.5"/>
    </clipPath>
  </defs>
  <g mask="url(#cut)">
    <polygon class="ink" points="9,4 39,4 43,8 24,25 5,8" stroke-width="5.2" stroke-linejoin="bevel"/>
    <polygon class="ink" points="9,44 39,44 43,40 24,23 5,40" stroke-width="5.2" stroke-linejoin="bevel"/>
  </g>
  <polygon class="lens" points="12,24 18,17.5 30,17.5 36,24 30,30.5 18,30.5"/>
  <g clip-path="url(#lens)">
    <polygon points="24,17.5 30.5,24 24,30.5 17.5,24" fill="#ff3b1f"/>
    <polygon points="24,20.5 27.5,24 24,27.5 20.5,24" fill="#08090a"/>
  </g>
</svg>
