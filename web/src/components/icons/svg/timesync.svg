<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Chronometer / Stopwatch Crown & Tactical Pushers -->
  <line x1="12" y1="1.5" x2="12" y2="4" stroke="#ff3b1f" stroke-width="1.8" stroke-linecap="square"/>
  <line x1="10" y1="1.5" x2="14" y2="1.5" stroke="#ff3b1f" stroke-width="1.5" stroke-linecap="square"/>
  <!-- Top Angled Lap Pusher -->
  <line x1="17.5" y1="3.5" x2="19.5" y2="5.5" stroke="#f2f3f5" stroke-width="1.4" stroke-linecap="square"/>

  <!-- Octagonal Tactical Dial Bezel -->
  <polygon points="8,4 16,4 21,9 21,17 16,22 8,22 3,17 3,9" stroke="#f2f3f5" stroke-width="1.6" stroke-linejoin="bevel"/>

  <!-- Subtle Internal Telemetry Quadrant Ticks -->
  <line x1="12" y1="5.5" x2="12" y2="7" stroke="#f2f3f5" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="12" y1="19" x2="12" y2="20.5" stroke="#f2f3f5" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="4.5" y1="13" x2="6" y2="13" stroke="#f2f3f5" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="18" y1="13" x2="19.5" y2="13" stroke="#f2f3f5" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Time-Sync Indicator: Leica Vermilion Minute & Hour Vectors pointing to sync index (2 o clock position) -->
  <line x1="12" y1="13" x2="12" y2="8" stroke="#ff3b1f" stroke-width="1.8" stroke-linecap="square"/>
  <line x1="12" y1="13" x2="16.5" y2="10" stroke="#ff3b1f" stroke-width="1.8" stroke-linecap="square"/>

  <!-- Precision Optical Diamond Hub Core -->
  <polygon points="12,11.2 13.8,13 12,14.8 10.2,13" fill="#ff3b1f"/>
  <circle cx="12" cy="13" r="0.65" fill="#f2f3f5"/>
</svg>
