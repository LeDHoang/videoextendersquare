# Install as /etc/systemd/system/user-<uid>.slice.d/50-sit-limits.conf, where
# <uid> is `id -u echosit`. Covers everything SIT does: echosit's rootless
# Docker daemon, its containers and its image builds. Runbook:
# docs/sit-runbook.md
[Slice]
CPUWeight=10
# A ceiling of 2 of the 4 vCPUs.
CPUQuota=200%
# Must hold an image build and the running old stack at once: deploy.sh builds
# before it restarts.
MemoryHigh=2.5G
MemoryMax=3G
