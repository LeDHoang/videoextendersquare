# Install as /etc/systemd/system/user.slice.d/50-sit-priority.conf
# Weights compete between siblings: system.slice (prod's root Docker daemon,
# its containers and builds) against user.slice (SIT, and SSH sessions). The
# default is 100 : 100; this gives prod about 5x the CPU under contention.
# Host-wide change; rollback in docs/sit-runbook.md.
[Slice]
CPUWeight=20
