# Install as /etc/systemd/system/user@<echosit-uid>.service.d/10-echosit-nft.conf.
# Runbook: docs/sit-runbook.md step 4.
#
# Fail closed: echosit's user manager, and the rootless Docker daemon it runs,
# start only once the nft guard table is loaded, and stop if it is unloaded.
[Unit]
Requires=echosit-nft.service
After=echosit-nft.service
