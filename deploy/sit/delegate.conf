# Install as /etc/systemd/system/user@.service.d/delegate.conf
# Hands the cpu, cpuset, io, memory and pids cgroup controllers to every
# user's systemd manager, so echosit's rootless Docker can apply compose's
# cpus and mem_limit. Host-wide change; rollback in docs/sit-runbook.md.
[Service]
Delegate=cpu cpuset io memory pids
