<!doctype html><meta charset="utf-8"><title>browser depth bench</title>
<!-- Times the split Video-Depth-Anything-Small (export_onnx.py --split) in onnxruntime-web.
     Serve with ../depthwarp/serve.py --work <dir holding the two .onnx files and onnxruntime-web's dist/>,
     then open /docs/perf-probes/2026-11-10/browserdepth/bench.html?ep=webgpu (or ep=wasm).
     Streaming cost: each 32-frame window adds 22 new frames (10 overlap frames reuse cached
     encoder output), so depth fps = 22 / (22 * encoder ms + head ms).
     Results PUT to /work/bench_<ep>.json. -->
<body style="background:#111;color:#eee;font:20px monospace"><pre id="o">loading...</pre>
<script type="module">
const q = new URLSearchParams(location.search);
const ep = q.get('ep') || 'webgpu';
const encRuns = Number(q.get('enc') || 10), headRuns = Number(q.get('head') || 3);
const T = 32, SIZE = 518, TOKENS = 37 * 37, DIM = 384, NEW_PER_WINDOW = 22;
const out = { ep, ua: navigator.userAgent, crossOriginIsolated, threads: 0 };
const show = () => { document.getElementById('o').textContent = JSON.stringify(out, null, 1); };
const ms = (t) => +(performance.now() - t).toFixed(1);
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };

try {
  const ort = await import('/work/' + (ep === 'webgpu' ? 'ort.webgpu.min.mjs' : 'ort.wasm.min.mjs'));
  ort.env.wasm.wasmPaths = '/work/';
  out.threads = ort.env.wasm.numThreads = crossOriginIsolated ? Math.min(8, navigator.hardwareConcurrency) : 1;
  out.ort = ort.env.versions?.web;
  const opts = { executionProviders: [ep], graphOptimizationLevel: 'all' };

  let t = performance.now();
  const enc = await ort.InferenceSession.create('/work/vda_small_encoder_518.onnx', opts);
  out.encoder_load_ms = ms(t); show();
  t = performance.now();
  const head = await ort.InferenceSession.create('/work/vda_small_head_t32_518.onnx', opts);
  out.head_load_ms = ms(t); show();

  const x = new ort.Tensor('float32', new Float32Array(3 * SIZE * SIZE).map(() => Math.random() - 0.5), [1, 3, SIZE, SIZE]);
  const encMs = [];
  let feats;
  for (let i = 0; i <= encRuns; i++) {      // run 0 is warm-up (shader compile)
    t = performance.now();
    feats = await enc.run({ x });
    await feats.f4.getData();               // include the readback the head needs
    const dt = ms(t);
    if (i === 0) out.encoder_first_ms = dt; else encMs.push(dt);
    out.encoder_ms = median(encMs); show();
  }
  const win = {};
  for (const k of ['f1', 'f2', 'f3', 'f4']) {
    const one = await feats[k].getData(), all = new Float32Array(T * TOKENS * DIM);
    for (let f = 0; f < T; f++) all.set(one, f * TOKENS * DIM);
    win[k] = new ort.Tensor('float32', all, [T, TOKENS, DIM]);
  }
  const headMs = [];
  for (let i = 0; i <= headRuns; i++) {
    t = performance.now();
    const r = await head.run(win);
    await r.depth.getData();
    const dt = ms(t);
    if (i === 0) out.head_first_ms = dt; else headMs.push(dt);
    out.head_ms = median(headMs); show();
  }
  out.depth_fps = +(NEW_PER_WINDOW / ((NEW_PER_WINDOW * out.encoder_ms + out.head_ms) / 1000)).toFixed(2);
} catch (e) { out.error = String(e.stack || e); }
show();
fetch(`/work/bench_${ep}.json`, { method: 'PUT', body: JSON.stringify(out) }).catch(() => {});
</script>
