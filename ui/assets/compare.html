<!-- Compare slider template. Placeholders: __BEFORE_URL__ __AFTER_URL__
     __BEFORE_LABEL__ __AFTER_LABEL__ __ACCENT__ __ASPECT__ __INK__ -->
<style>
  .sx-cmp-wrap {
    position: relative;
    width: 100%;
    margin: auto;
    overflow: hidden;
    background: #000;
    aspect-ratio: __ASPECT__;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .sx-cmp-wrap video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .sx-cmp-after { clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); }
  .sx-cmp-handle {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 3px;
    background: __ACCENT__;
    cursor: ew-resize;
    z-index: 10;
    transform: translateX(-50%);
  }
  .sx-cmp-handle::after {
    content: '↔';
    position: absolute;
    top: 50%; left: 50%;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: __ACCENT__;
    color: #0A0A0A;
    font-weight: 700;
    transform: translate(-50%, -50%);
  }
  .sx-cmp-labels {
    position: absolute;
    bottom: 52px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 0 16px;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 5;
  }
  .sx-cmp-label {
    background: __ACCENT__;
    color: #0A0A0A;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .sx-cmp-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    background: rgba(0, 0, 0, 0.78);
    padding: 8px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 20;
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .sx-cmp-wrap:hover .sx-cmp-bar { opacity: 1; }
  .sx-cmp-bar button {
    background: transparent;
    border: 1px solid __INK__;
    color: __INK__;
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 14px;
  }
  .sx-cmp-bar button:hover { background: __ACCENT__; color: #0A0A0A; border-color: __ACCENT__; }
</style>

<div class="sx-cmp-wrap" id="sxWrap">
  <video id="sxBefore" src="__BEFORE_URL__" muted loop playsinline autoplay></video>
  <video id="sxAfter" class="sx-cmp-after" src="__AFTER_URL__" muted loop playsinline autoplay></video>
  <div class="sx-cmp-handle" id="sxHandle"></div>
  <div class="sx-cmp-labels">
    <div class="sx-cmp-label">__BEFORE_LABEL__</div>
    <div class="sx-cmp-label">__AFTER_LABEL__</div>
  </div>
  <div class="sx-cmp-bar">
    <button id="sxPlay">⏸ Pause</button>
    <button id="sxFull">⛶ Fullscreen</button>
  </div>
</div>

<script>
  (function () {
    const wrap = document.getElementById('sxWrap');
    const before = document.getElementById('sxBefore');
    const after = document.getElementById('sxAfter');
    const handle = document.getElementById('sxHandle');
    const playBtn = document.getElementById('sxPlay');
    const fullBtn = document.getElementById('sxFull');

    before.addEventListener('play', () => after.play().catch(() => {}));
    before.addEventListener('pause', () => after.pause());
    before.addEventListener('seeked', () => {
      if (Math.abs(after.currentTime - before.currentTime) > 0.1) {
        after.currentTime = before.currentTime;
      }
    });
    // Re-sync periodically: independent loops drift apart over time.
    setInterval(() => {
      if (!before.paused && Math.abs(after.currentTime - before.currentTime) > 0.15) {
        after.currentTime = before.currentTime;
      }
    }, 1000);

    playBtn.addEventListener('click', () => {
      if (before.paused) {
        before.play().catch(() => {});
        playBtn.innerHTML = '⏸ Pause';
      } else {
        before.pause();
        playBtn.innerHTML = '▶ Play';
      }
    });

    fullBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        wrap.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    let dragging = false;
    const move = (clientX) => {
      const rect = wrap.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      handle.style.left = pct + '%';
      after.style.clipPath =
        'polygon(' + pct + '% 0, 100% 0, 100% 100%, ' + pct + '% 100%)';
    };

    handle.addEventListener('mousedown', (e) => { dragging = true; e.preventDefault(); });
    window.addEventListener('mouseup', () => { dragging = false; });
    window.addEventListener('mousemove', (e) => { if (dragging) move(e.clientX); });
    handle.addEventListener('touchstart', () => { dragging = true; }, { passive: true });
    window.addEventListener('touchend', () => { dragging = false; });
    window.addEventListener('touchmove', (e) => {
      if (dragging && e.touches[0]) move(e.touches[0].clientX);
    }, { passive: true });
  })();
</script>
