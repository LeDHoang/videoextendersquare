<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR video-path A/B — direct VideoTexture (temporary diagnostic)</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e8e8e8;font-family:system-ui,sans-serif}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:24px;text-align:center}
  #enter{font-size:20px;padding:14px 28px;border-radius:10px;border:2px solid #ff553a;background:#1a1a1a;color:#fff;cursor:pointer}
  #status{opacity:.8;font-size:14px;max-width:640px;word-break:break-all}
  video{position:fixed;left:0;bottom:0;width:180px;opacity:.6}
</style>
</head>
<body>
<div id="ui">
  <h1>video-path A/B</h1>
  <p>Direct <code>THREE.VideoTexture</code> of the master, no canvas proxy, no UI meshes, no readbacks — the same path other Quest video sites use.</p>
  <button id="enter">Enter VR</button>
  <div id="status">src: __DEFAULT_SRC__</div>
</div>
<video id="v" playsinline webkit-playsinline muted loop preload="auto"></video>
<script>__THREE_JS__</script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var video = document.getElementById('v');
  var qs = new URLSearchParams(location.search);
  var src = qs.get('src') || '__DEFAULT_SRC__';
  video.src = src;
  video.muted = true;
  function say(msg) { statusEl.textContent = msg; }

  var renderer = null, tex = null;
  var xrFrames = 0, dtMaxMs = 0, lastT = 0, shown = 0, lastVT = -1;
  var diagTimer = null;

  function frameStats(now) {
    if (lastT) {
      var dt = now - lastT;
      dtMaxMs = Math.max(dtMaxMs, dt);
    }
    lastT = now;
    xrFrames += 1;
    try {
      var ct = video.currentTime;
      if (ct !== lastVT) { shown += 1; lastVT = ct; }
    } catch (e) {}
  }

  function postDiag() {
    var decoded = null;
    try {
      var q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
      decoded = q ? q.totalVideoFrames : (video.webkitDecodedFrameCount || null);
    } catch (e) {}
    var body = {
      engine: 'v1-ab-direct-video-texture', src: src,
      xrFrames: xrFrames, dtMaxMs: Math.round(dtMaxMs * 10) / 10,
      videoUploads: shown, overlayUploads: 0, dockUploads: 0, panelUploads: 0,
      transChanges: 0, transClears: 0, transNotReady: 0,
      decodedFrames: decoded,
      flags: { abDirect: true }
    };
    xrFrames = 0; dtMaxMs = 0; shown = 0;
    try {
      fetch('diag', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) {}
  }

  document.getElementById('enter').addEventListener('click', async function () {
    try {
      if (!window.THREE) { say('three.min.js did not load'); return; }
      if (!navigator.xr) { say('navigator.xr absent (needs HTTPS or localhost)'); return; }
      renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(70, 1, 0.1, 60);
      tex = new THREE.VideoTexture(video);
      try { tex.colorSpace = THREE.SRGBColorSpace; } catch (e) {}
      var plane = new THREE.Mesh(
        new THREE.PlaneGeometry(4, 4),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      plane.position.set(0, 1.6, -2.24);
      scene.add(plane);
      var session = await navigator.xr.requestSession('immersive-vr', {
        optionalFeatures: ['local-floor', 'local']
      });
      await renderer.xr.setSession(session);
      try { await video.play(); } catch (e) { say('video.play failed: ' + e); return; }
      document.getElementById('ui').style.display = 'none';
      lastT = 0;
      renderer.setAnimationLoop(function (t) {
        frameStats(t || performance.now());
        renderer.render(scene, camera);
      });
      diagTimer = setInterval(postDiag, 1000);
      session.addEventListener('end', function () { try { clearInterval(diagTimer); } catch (e) {} });
    } catch (e) {
      say('enter failed: ' + (e && e.message ? e.message : e));
    }
  });
})();
</script>
</body>
</html>
