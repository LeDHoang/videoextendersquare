    function playbackMeasurements(item, state) {
      const durationMs = isImageItem(item)
        ? IMAGE_DWELL_S * 1000
        : (video && Number.isFinite(video.duration) ? Math.round(video.duration * 1000) : null);
      let playbackQuality = {};
      try {
        const quality = video && video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
        if (quality) {
          playbackQuality = {
            dropped_frames: Number(quality.droppedVideoFrames || 0),
            total_frames: Number(quality.totalVideoFrames || 0),
          };
        }
      } catch (e) {}
      return {
        foreground_ms: Math.round(state.watchMs),
        duration_ms: durationMs,
        watch_ratio: durationMs ? Math.min(4, state.watchMs / durationMs) : null,
        playback_quality: playbackQuality,
      };
    }

    function tickViewTracker() {
      const state = viewTracker;
      if (!state || state.finished) return;
      const now = performance.now();
      const active = !document.hidden && (isImageItem(state.item) || (video && !video.paused && !video.ended));
      if (active) state.watchMs += Math.max(0, now - state.lastTick);
      state.lastTick = now;
      if (!state.viewSent && state.watchMs >= state.thresholdMs) {
        state.viewSent = true;
        const measurements = playbackMeasurements(state.item, state);
        requestJson('/api/posts/' + encodeURIComponent(state.item.post_id) + '/view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            watch_ms: Math.round(state.watchMs),
            foreground_ms: measurements.foreground_ms,
            duration_ms: measurements.duration_ms,
            watch_ratio: measurements.watch_ratio,
            position_ms: isImageItem(state.item) ? null : Math.round((video.currentTime || 0) * 1000),
            completed: false,
            pack_id: isPackMode && packState.pack ? packState.pack.id : null,
            source: analyticsSource,
            client_event_id: state.viewEventId,
            client_occurred_at: new Date().toISOString(),
            recommendation_impression_id: recommendationImpressionId(state.item),
            playback_quality: measurements.playback_quality,
            context: { media_type: state.item.media_type || 'video' },
          }),
        }).then((result) => {
          state.item.views = result.views;
          if (videoData[idx] === state.item) refreshEngagementUI();
        }).catch(() => {});
      }
      maybeClaimReelReward(state);
    }

    function startViewTracking(item) {
      finishViewTracking('skip');
      if (!item || !item.post_id) return;
      viewTracker = {
        item: item,
        watchMs: 0,
        lastTick: performance.now(),
        thresholdMs: isImageItem(item) ? 2000 : 3000,
        viewSent: false,
        viewEventId: eventId(),
        rewardClaimSent: false,
        rewardEventId: eventId(),
        finished: false,
        interval: setInterval(tickViewTracker, 250),
      };
      requestJson('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event_type: 'impression',
          post_id: item.post_id,
          pack_id: isPackMode && packState.pack ? packState.pack.id : null,
          source: analyticsSource,
          client_event_id: eventId(),
          client_occurred_at: new Date().toISOString(),
          recommendation_impression_id: recommendationImpressionId(item),
          context: {
            index: idx,
            position: item.recommendation ? item.recommendation.position : idx,
            media_type: item.media_type || 'video',
          },
        }),
      }).catch(() => {});
    }

    function finishViewTracking(reason) {
      const state = viewTracker;
      if (!state || state.finished) return;
      tickViewTracker();
      state.finished = true;
      if (state.interval) clearInterval(state.interval);
      viewTracker = null;
      const completed = reason === 'complete';
      const measurements = playbackMeasurements(state.item, state);
      if (completed && !state.viewSent) {
        state.viewSent = true;
        requestJson('/api/posts/' + encodeURIComponent(state.item.post_id) + '/view', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            watch_ms: Math.round(state.watchMs),
            foreground_ms: measurements.foreground_ms,
            duration_ms: measurements.duration_ms,
            watch_ratio: measurements.watch_ratio,
            position_ms: isImageItem(state.item) ? null : Math.round((video.currentTime || 0) * 1000),
            completed: true,
            pack_id: isPackMode && packState.pack ? packState.pack.id : null,
            source: analyticsSource,
            client_event_id: state.viewEventId,
            client_occurred_at: new Date().toISOString(),
            recommendation_impression_id: recommendationImpressionId(state.item),
            playback_quality: measurements.playback_quality,
            context: { media_type: state.item.media_type || 'video' },
          }),
        }).then((result) => {
          state.item.views = result.views;
          if (videoData[idx] === state.item) refreshEngagementUI();
        }).catch(() => {});
      }
      if (state.watchMs <= 0) return;
      requestJson('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event_type: completed ? 'complete' : 'skip',
          post_id: state.item.post_id,
          watch_ms: Math.round(state.watchMs),
          foreground_ms: measurements.foreground_ms,
          duration_ms: measurements.duration_ms,
          watch_ratio: measurements.watch_ratio,
          position_ms: isImageItem(state.item) ? null : Math.round((video.currentTime || 0) * 1000),
          completed: completed,
          navigation_reason: completed ? 'media_ended' : reason,
          pack_id: isPackMode && packState.pack ? packState.pack.id : null,
          source: analyticsSource,
          client_event_id: eventId(),
          client_occurred_at: new Date().toISOString(),
          recommendation_impression_id: recommendationImpressionId(state.item),
          playback_quality: measurements.playback_quality,
          context: { qualified_view_sent: state.viewSent, media_type: state.item.media_type || 'video' },
        }),
      }).catch(() => {});
    }

    async function likeComment(cid) {
      const target = getCurrentComments().find((entry) => entry.id === cid);
      if (!target) return null;
      if (!currentUser) {
        requestAuthentication({ kind: 'comment-like', comment_id: cid, post_id: target.post_id });
        return null;
      }
      const wasLiked = !!target.liked_by_me;
      const oldLikes = Number(target.likes) || 0;
      target.liked_by_me = !wasLiked;
      target.likes = Math.max(0, oldLikes + (target.liked_by_me ? 1 : -1));
      renderDrawerComments();
      try {
        const result = await requestJson('/api/comments/' + encodeURIComponent(cid) + '/like', {
          method: target.liked_by_me ? 'PUT' : 'DELETE',
        });
        target.likes = result.likes;
        target.liked_by_me = !!result.liked;
        renderDrawerComments();
        return result.likes;
      } catch (error) {
        target.likes = oldLikes;
        target.liked_by_me = wasLiked;
        renderDrawerComments();
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({ kind: 'comment-like', comment_id: cid, post_id: target.post_id });
        } else {
          showFlash('COMMENT LIKE FAILED');
        }
        return null;
      }
    }

    async function deleteComment(cid) {
      const item = videoData[idx];
      const target = getCurrentComments().find((entry) => entry.id === cid);
      if (!item || !target || !target.can_delete) return;
      try {
        await requestJson('/api/comments/' + encodeURIComponent(cid), { method: 'DELETE' });
        item.comments = getCurrentComments().filter((entry) => entry.id !== cid);
        item.comments_count = Math.max(0, Number(item.comments_count || item.comments.length + 1) - 1);
        renderDrawerComments();
        renderCommentMarkers();
        showFlash('COMMENT DELETED');
      } catch (error) {
        showFlash(error.status === 403 ? 'NOT ALLOWED' : 'DELETE FAILED');
      }
    }

    async function postComment(text, timestamp) {
      const item = videoData[idx];
      if (!item || !item.post_id) return null;
      const normalizedTimestamp = timestamp !== null && timestamp !== undefined
        ? Math.round(Number(timestamp) * 10) / 10
        : null;
      if (!currentUser) {
        requestAuthentication({
          kind: 'comment',
          post_id: item.post_id,
          text: text,
          timestamp: normalizedTimestamp,
        });
        return null;
      }
      try {
        const newComment = await requestJson('/api/posts/' + encodeURIComponent(item.post_id) + '/comments', {
          method: 'POST',
          headers: recommendationHeaders(item, { 'Content-Type': 'application/json' }),
          body: JSON.stringify({ text: text, timestamp: normalizedTimestamp }),
        });
        if (!item.comments) item.comments = [];
        item.comments.push(newComment);
        item.comments_count = Number(item.comments_count || 0) + 1;
        renderDrawerComments();
        renderCommentMarkers();
        showFlash('COMMENT POSTED');
        return newComment;
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({
            kind: 'comment',
            post_id: item.post_id,
            text: text,
            timestamp: normalizedTimestamp,
          });
        } else {
          showFlash('COMMENT FAILED');
        }
        return null;
      }
    }

    // ── Comments Markers on Timeline (SoundCloud Style) ──
    function appendCommentAvatar(container, comment) {
      if (comment.author_avatar_url) {
        const image = document.createElement('img');
        image.src = comment.author_avatar_url;
        image.alt = '';
        container.appendChild(image);
        return;
      }
      const initials = document.createElement('span');
      initials.className = 'comment-avatar-initials';
      initials.textContent = comment.author_avatar || getInitials(comment.author_name || 'Anonymous');
      initials.style.color = safeColor(comment.avatar_color, '#ff553a');
      container.appendChild(initials);
    }

    function renderCommentMarkers() {
      if (!commentMarkers) return;
      commentMarkers.replaceChildren();
      const duration = video.duration;
      if (!duration || isNaN(duration)) return;

      getCurrentComments().forEach((comment) => {
        if (comment.timestamp === null || comment.timestamp === undefined) return;
        const pct = Math.max(0, Math.min(100, (Number(comment.timestamp) / duration) * 100));
        const dot = document.createElement('div');
        dot.className = 'reels-comment-dot';
        dot.style.left = pct + '%';
        dot.style.backgroundColor = safeColor(comment.avatar_color, '#FF3B1F');

        const tooltip = document.createElement('div');
        tooltip.className = 'reels-dot-tooltip';
        const avatar = document.createElement('span');
        avatar.textContent = comment.author_avatar || '👤';
        const author = document.createElement('strong');
        author.textContent = comment.author_name || 'Anonymous';
        const time = document.createElement('span');
        time.textContent = '⏱ ' + formatTime(comment.timestamp);
        tooltip.append(avatar, author, time);
        dot.appendChild(tooltip);

        dot.addEventListener('click', (event) => {
          event.stopPropagation();
          video.currentTime = Number(comment.timestamp);
          showFlash('⏱ ' + formatTime(comment.timestamp));
        });
        commentMarkers.appendChild(dot);
      });
    }

    // ── Bottom-Middle Twitch-Style Ticker (When Drawer Closed) ──
    let tickerHideTimer = null;
    let tickerSignature = '';
    function showTicker() {
      if (tickerHideTimer) { clearTimeout(tickerHideTimer); tickerHideTimer = null; }
      twitchCommentTicker.style.opacity = '1';
      twitchCommentTicker.style.transform = 'translateY(0)';
      // Yield the bottom-left corner to the ticker so the two never overlap
      if (reelsMeta) reelsMeta.classList.add('ticker-active');
    }
    function hideTicker() {
      twitchCommentTicker.style.opacity = '0';
      twitchCommentTicker.style.transform = 'translateY(8px)';
      if (reelsMeta) reelsMeta.classList.remove('ticker-active');
      // Keep pills mounted while they fade out; clear after the transition ends
      if (!tickerHideTimer && twitchCommentTicker.innerHTML) {
        tickerHideTimer = setTimeout(() => {
          twitchCommentTicker.innerHTML = '';
          tickerSignature = '';
          tickerHideTimer = null;
        }, 160);
      }
    }
    function updateTwitchTicker() {
      if (!twitchCommentTicker) return;
      if (commentsDrawer && commentsDrawer.classList.contains('open')) {
        hideTicker();
        return;
      }

      const curTime = video.currentTime || 0;
      const active = getCurrentComments().filter((comment) => {
        if (comment.timestamp === null || comment.timestamp === undefined) return false;
        const timestamp = Number(comment.timestamp);
        return curTime >= timestamp && curTime <= timestamp + 3.2;
      });

      if (!active.length) {
        hideTicker();
        return;
      }

      showTicker();
      const visible = active.slice(0, 2);
      const signature = visible.map((comment) => comment.id).join(',');
      if (signature === tickerSignature) return;
      tickerSignature = signature;
      twitchCommentTicker.replaceChildren();

      visible.forEach((comment) => {
        const pill = document.createElement('div');
        pill.className = 'twitch-comment-pill';
        pill.dataset.cid = comment.id;
        pill.title = 'Open comment in panel';

        const avatar = document.createElement('div');
        avatar.className = 'twitch-avatar';
        avatar.textContent = comment.author_avatar || '👤';

        const author = document.createElement('span');
        author.className = 'twitch-author';
        author.style.color = safeColor(comment.avatar_color, '#FF3B1F');
        author.textContent = comment.author_name || 'Anonymous';

        const body = document.createElement('span');
        body.className = 'twitch-text';
        const timestamp = document.createElement('span');
        timestamp.className = 'twitch-tag';
        timestamp.textContent = '⏱' + formatTime(comment.timestamp) + ' ';
        body.append(timestamp, document.createTextNode(comment.text || ''));

        pill.append(avatar, author, body);
        pill.addEventListener('click', (event) => {
          event.stopPropagation();
          openDrawerToComment(comment.id);
        });
        twitchCommentTicker.appendChild(pill);
      });
    }

    // ── Jump to a specific comment in the drawer (from a pop-up pill) ──
    function openDrawerToComment(commentId) {
      if (!commentId) return;
      toggleDrawer(true);
      setActiveTab('all');
      // Wait for the drawer slide-up (0.34s) so scroll offsets are correct
      setTimeout(() => {
        if (!commentsList) return;
        const target = commentsList.querySelector('#comment-' + commentId);
        if (target) {
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          target.classList.remove('comment-highlight');
          // force reflow so the highlight animation restarts each jump
          void target.offsetWidth;
          target.classList.add('comment-highlight');
          setTimeout(() => target.classList.remove('comment-highlight'), 2400);
        }
      }, 380);
    }

    // ── Active tab control helpers ──
    function setActiveTab(key) {
      const map = { all: tabAll, sync: tabSync, general: tabGeneral };
      const activeEl = map[key] || tabAll;
      [tabAll, tabSync, tabGeneral].forEach((t) => t && t.classList.remove('active'));
      if (activeEl) activeEl.classList.add('active');
      activeTab = (activeEl && activeEl.getAttribute('data-tab')) || 'all';
      renderDrawerComments();
    }

    // ── Drawer Comments List Rendering (Aesthetic Refresh) ──
    function getInitials(name) {
      if (!name) return '??';
      const parts = name.split(/[_\s]+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      if (name.length <= 4) return name.slice(0,2).toUpperCase();
      return name.slice(0,2).toUpperCase();
    }
    function renderDrawerComments() {
      if (!commentsList) return;
      const comments = getCurrentComments();
      const countEl = drawerTitle ? drawerTitle.querySelector('.drawer-title-count') : null;
      if (countEl) countEl.textContent = `(${comments.length})`;
      else if (drawerTitle) drawerTitle.textContent = `COMMENTS (${comments.length})`;
      if (commentBadge) commentBadge.textContent = String(comments.length);

      let filtered = comments;
      if (activeTab === 'sync') {
        filtered = comments.filter((comment) => comment.timestamp !== null && comment.timestamp !== undefined);
      } else if (activeTab === 'general') {
        filtered = comments.filter((comment) => comment.timestamp === null || comment.timestamp === undefined);
      }

      commentsList.replaceChildren();
      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'comment-empty';
        const qualifier = activeTab === 'sync' ? 'time-synced ' : activeTab === 'general' ? 'general ' : '';
        empty.append(
          document.createTextNode('No ' + qualifier + 'comments yet.'),
          document.createElement('br'),
          document.createTextNode('Be the first to drop one below!')
        );
        commentsList.appendChild(empty);
        return;
      }

      filtered.forEach((comment) => {
        const border = safeColor(comment.avatar_color, '#ff553a');
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.id = 'comment-' + comment.id;
        item.style.setProperty('--avatar-border', border);

        const head = document.createElement('div');
        head.className = 'comment-item-head';
        const left = document.createElement('div');
        left.className = 'comment-item-head-left';

        const avatar = document.createElement('div');
        avatar.className = 'comment-avatar';
        avatar.style.borderColor = border;
        appendCommentAvatar(avatar, comment);

        const name = document.createElement('button');
        name.type = 'button';
        name.className = 'comment-name';
        name.style.color = border;
        name.textContent = comment.author_name || 'Anonymous';
        name.title = comment.author_name ? 'Open @' + comment.author_name + ' profile' : '';
        name.addEventListener('click', () => openProfile(comment.author_name));

        let timeControl;
        if (comment.timestamp !== null && comment.timestamp !== undefined) {
          timeControl = document.createElement('button');
          timeControl.type = 'button';
          timeControl.className = 'comment-time-btn';
          const syncTpl = document.getElementById('timesyncIconTpl');
          if (syncTpl && syncTpl.content && syncTpl.content.firstElementChild) {
            timeControl.append(syncTpl.content.firstElementChild.cloneNode(true));
          }
          timeControl.append(document.createTextNode(' ' + formatTime(comment.timestamp)));
          timeControl.addEventListener('click', () => {
            const timestamp = Number(comment.timestamp);
            if (!isNaN(timestamp)) {
              video.currentTime = timestamp;
              showFlash('⏱ ' + formatTime(timestamp));
            }
          });
        } else {
          timeControl = document.createElement('span');
          timeControl.className = 'comment-time-gen';
          const icon = document.createElement('span');
          icon.className = 'material-symbols-outlined';
          icon.style.fontSize = '12px';
          icon.textContent = 'forum';
          timeControl.append(icon, document.createTextNode(' GENERAL'));
        }

        left.append(avatar, name, timeControl);

        const actions = document.createElement('div');
        actions.className = 'comment-actions';
        const like = document.createElement('button');
        like.type = 'button';
        like.className = 'comment-like-btn' + (comment.liked_by_me ? ' active' : '');
        like.title = comment.liked_by_me ? 'Unlike comment' : 'Like comment';
        const likeIcon = document.createElement('span');
        likeIcon.className = 'material-symbols-outlined';
        likeIcon.textContent = 'favorite';
        const likeCountNode = document.createElement('span');
        likeCountNode.textContent = String(comment.likes || 0);
        like.append(likeIcon, likeCountNode);
        like.addEventListener('click', () => likeComment(comment.id));
        actions.appendChild(like);

        if (comment.can_delete) {
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'comment-delete-btn';
          remove.textContent = 'DELETE';
          remove.addEventListener('click', () => deleteComment(comment.id));
          actions.appendChild(remove);
        }

        head.append(left, actions);
        const message = document.createElement('p');
        if (!comment.can_delete) {
          const report = document.createElement('button');
          report.type = 'button';
          report.className = 'comment-delete-btn';
          report.textContent = 'REPORT';
          report.addEventListener('click', () => reportTarget('comment', comment.id));
          actions.appendChild(report);
        }
        message.className = 'comment-msg';
        message.textContent = comment.text || '';
        item.append(head, message);
        commentsList.appendChild(item);
      });
    }

    function toggleDrawer(open) {
      if (!commentsDrawer) return;
      const willOpen = (typeof open === 'boolean') ? open : !commentsDrawer.classList.contains('open');
      if (willOpen) {

    }

    // Tab button listeners
    [tabAll, tabSync, tabGeneral].forEach((tab) => {
      if (!tab) return;
      tab.addEventListener('click', () => setActiveTab(tab.getAttribute('data-tab')));
    });

    if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', () => toggleDrawer(false));
    if (commentBtn) commentBtn.addEventListener('click', () => toggleDrawer());
    if (likeBtn) likeBtn.addEventListener('click', () => likeCurrentReel());
    if (saveBtn) saveBtn.addEventListener('click', () => openCollectOverlay());
    if (collectMenuClose) collectMenuClose.addEventListener('click', () => closeCollectOverlay());
    if (collectMenuBackdrop) collectMenuBackdrop.addEventListener('click', () => closeCollectOverlay());
    if (collectMenuNew) collectMenuNew.addEventListener('click', () => {

      }
    });
    if (collectMenuJustSave) collectMenuJustSave.addEventListener('click', async () => {
      await saveCurrentReel();
      if (collectOpen && !collectPresenting()) renderCollectMenuDom();
    });
    if (collectNewCreate) collectNewCreate.addEventListener('click', () => submitCollectNew());
    if (collectNewCancel) collectNewCancel.addEventListener('click', () => hideCollectNewRow());
    if (collectNewName) {
      collectNewName.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {

          submitCollectNew();
        } else if (event.key === 'Escape') {

    }
    if (shareBtn) shareBtn.addEventListener('click', () => shareCurrentReel());
    if (packQueueBtn) packQueueBtn.addEventListener('click', () => setPackQueue());
    if (packSaveBtn) packSaveBtn.addEventListener('click', () => togglePackSave());
    if (packShareBtn) packShareBtn.addEventListener('click', () => shareCurrentPack());
    if (packQueueClose) packQueueClose.addEventListener('click', () => setPackQueue(false));
    if (packQueueSave) packQueueSave.addEventListener('click', () => togglePackSave());
    if (packQueueShare) packQueueShare.addEventListener('click', () => shareCurrentPack());
    if (packQueuePublish) packQueuePublish.addEventListener('click', () => publishPackFromPlayer());
    if (packStagePrimary) {
      packStagePrimary.addEventListener('click', () => {

      });

    if (packStageSecondary) packStageSecondary.addEventListener('click', returnToPack);
    if (packStageExplore) packStageExplore.addEventListener('click', () => dispatchNavigation('/explore?type=packs'));
    if (packStageCard) packStageCard.addEventListener('click', (event) => event.stopPropagation());
    if (packQueuePanel) packQueuePanel.addEventListener('click', (event) => event.stopPropagation());
    if (followBtn) followBtn.addEventListener('click', () => followCurrentCreator());
    if (followPill) followPill.addEventListener('click', () => followCurrentCreator());
    if (notInterestedBtn) notInterestedBtn.addEventListener('click', () => dismissCurrentRecommendation('not_interested'));
    if (hideCreatorBtn) hideCreatorBtn.addEventListener('click', () => dismissCurrentRecommendation('hide_creator'));
    if (reportBtn) reportBtn.addEventListener('click', () => reportTarget('post', videoData[idx] && videoData[idx].post_id));
    if (metaCreator) {
      metaCreator.addEventListener('click', () => {
        const creator = videoData[idx] && videoData[idx].creator;
        if (creator && creator.username) openProfile(creator.username);
      });
    }
    if (accountBtn) {
      accountBtn.addEventListener('click', () => {
        if (currentUser) openProfile(currentUser.username);
        else requestAuthentication({ kind: 'account' });
      });
    }

    if (syncTimeToggle) {
      syncTimeToggle.addEventListener('click', () => {
        isSyncTimeActive = !isSyncTimeActive;
        if (isSyncTimeActive) {
          syncTimeToggle.classList.remove('inactive');
          syncTimeToggle.classList.add('active');
          if (commentInput) commentInput.placeholder = `Add a comment at ${formatTime(video.currentTime)}...`;
        } else {
          syncTimeToggle.classList.remove('active');
          syncTimeToggle.classList.add('inactive');
          if (commentInput) commentInput.placeholder = 'Add a general comment...';
        }
      });
    }

    if (commentForm) {
      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const txt = (commentInput ? commentInput.value : '').trim();
        if (!txt) return;
        // Stills have no playback clock — always post general comments.
        const ts = (isSyncTimeActive && !isImageItem(videoData[idx])) ? video.currentTime : null;
        const posted = await postComment(txt, ts);
        if (posted && commentInput) commentInput.value = '';
      });
    }

    function preloadNext(currentIndex) {
      if (!videoData || videoData.length <= 1) {
        clearPreloadVideo();
        return;
      }
      const nextIdx = currentIndex + 1;
      const nextItem = videoData[nextIdx];
      if (!nextItem || nextItem.available === false || nextItem.media_type === 'static') {
        clearPreloadVideo();
        return;
      }
      if (isImageItem(nextItem)) {
        clearPreloadVideo();
        // Warm the browser cache for the still; the <video> preloader can't
        // decode image files.
        try {
          const warmer = new Image();
          warmer.src = blobUrlMap[nextIdx] || resolveItemUrl(nextItem);
        } catch (e) {}
        return;
      }
      if (preloadVideo) {
        preloadVideo.src = blobUrlMap[nextIdx] || resolveItemUrl(nextItem);
        preloadVideo.load();
      }
    }

    // Render one image tile: still on screen, no timeline, 10s dwell.
    function showImage(item, options) {
      try { video.pause(); } catch (e) {}
      try {
        video.removeAttribute('src');
        video.load();
      } catch (e) {}
      const itemUrl = blobUrlMap[idx] || resolveItemUrl(item);
      video.style.display = 'none';
      reelsImage.src = itemUrl;
      reelsImage.alt = item.title || item.filename || 'Image reel';
      reelsImage.onload = notifyVisualSourceChange;
      reelsImage.style.display = 'block';
      if (videoWrap) videoWrap.classList.add('image-mode');
      if (progressWrap) progressWrap.classList.add('image-hidden');
      if (commentMarkers) commentMarkers.innerHTML = '';
      hideTicker();
      updatePlayBtnUI(true);

      // Preload subsequent track in background
      preloadNext(idx);

      // Stills carry no stereo layout; reset any SBS sampling from video reels.
      if (typeof WebXRVR !== 'undefined' && WebXRVR.setStereo) {
        WebXRVR.setStereo(false);
      }
      if (typeof WebXRVR !== 'undefined' && WebXRVR.onVideoChange) {
        WebXRVR.onVideoChange();
      }
      if (!options || options.autoplay !== false) armImageTimer();
      else updatePlayBtnUI(false);
      if (isPackMode) schedulePackProgress();
    }

    function loadVideo(index, options) {
      const loadOptions = options || {};
      if (collectOpen) closeCollectOverlay();
      hideError();
      clearImageTimer();
      if (typeof resetPan === 'function') resetPan();
      if (!videoData.length) {
        showError('No recommendations are currently available.');
        if (counter) counter.textContent = '0 / 0';
        return;
      }
      if (index < 0) index = 0;
      if (index >= videoData.length) index = videoData.length - 1;
      idx = index;
      pruneBlobCache(idx);

      const item = videoData[idx];
      if (isPackMode) {
        packState.index = idx;
        packState.phase = 'playing';
        packState.resumePositionMs = 0;
        syncPackChrome();
        if (!item || item.available === false || item.media_type === 'static') {
          try { video.pause(); } catch (e) {}
          video.style.display = 'none';
          if (reelsImage) {
            reelsImage.style.display = 'none';
            reelsImage.removeAttribute('src');
          }
          if (progressWrap) progressWrap.classList.add('image-hidden');
          metaFolder.textContent = '▦ REEL PACK';
          metaTitle.textContent = 'Reel unavailable';
          metaSize.textContent = '';
          showPackStage('unavailable');
          persistPackProgress(true);
          if (packUnavailableTimer) clearTimeout(packUnavailableTimer);
          packUnavailableTimer = setTimeout(() => nextVideo('unavailable'), 1600);
          return;
        }
        hidePackStage();
      }
      if (counter) counter.textContent = (idx + 1) + ' / ' + videoData.length + (feedHasMore ? '+' : '');
      metaFolder.textContent = isPackMode ? '▦ PACK ' + (idx + 1) + ' OF ' + videoData.length : '📁 ' + (item.folder || 'root');
      metaTitle.textContent = item.title || item.filename;
      try {
        metaTitle.title = item.caption || item.filename;
      } catch (e) {}
      metaSize.textContent = item.size || '';
      refreshEngagementUI();
      startViewTracking(item);
      maybeFetchMore();
      if (isPackMode) recordPackEvent('pack_item_view', { index: idx });

      // Update comments display for this reel
      renderDrawerComments();

      if (isImageItem(item)) {
        showImage(item, loadOptions);
        return;
      }

      // Back to video mode after a still.
      video.style.display = '';
      if (reelsImage) {
        reelsImage.style.display = 'none';
        reelsImage.removeAttribute('src');
      }
      if (videoWrap) videoWrap.classList.remove('image-mode');
      if (progressWrap) progressWrap.classList.remove('image-hidden');

      const itemUrl = blobUrlMap[idx] || resolveItemUrl(item);
      video.src = itemUrl;
      video.muted = isMuted;
      const requestedTime = Number(loadOptions.seekTo);
      if (Number.isFinite(requestedTime) && requestedTime > 0) {
        const restoreTime = function () {
          try { video.currentTime = Math.min(requestedTime, video.duration || requestedTime); } catch (e) {}
        };
        if (video.readyState >= 1) restoreTime();
        else video.addEventListener('loadedmetadata', restoreTime, { once: true });
      }
      if (isPackMode) schedulePackProgress();

      renderCommentMarkers();
      updateTwitchTicker();

      // Preload subsequent video track in background
      preloadNext(idx);

      // SBS stereo detection: enable per-eye half-frame sampling in VR mode for
      // spatialized reels (e.g. folder "testpipeline-3d" or *_sbs/_3d filenames).
      const isSbs =
        /(^|[\s_\-.])(sbs|3d)([\s_\-.]|$)/i.test(item.filename || '') ||
        /3d/i.test(item.folder || '');
      if (typeof WebXRVR !== 'undefined' && WebXRVR.setStereo) {
        WebXRVR.setStereo(isSbs);
      }

      if (typeof WebXRVR !== 'undefined' && WebXRVR.onVideoChange) {
        WebXRVR.onVideoChange();
      }

      if (loadOptions.autoplay === false) {
        video.pause();
        updatePlayBtnUI(false);
        return;
      }

      video.play().then(() => {
        updatePlayBtnUI(true);
      }).catch((err) => {
        video.muted = true;
        isMuted = true;
        updateSoundBtnUI(true);
        video.play().then(() => {
          updatePlayBtnUI(true);
        }).catch(() => {
          updatePlayBtnUI(false);
        });
      });
    }

    function updatePlayBtnUI(isPlaying) {
      if (!playBtn) return;
      if (isPlaying) {
        playBtn.innerHTML = `
          <span class="btn-icon">
            __ICON_PAUSE__
          </span>
          <span class="action-btn-label">PAUSE</span>
        `;
      } else {
        playBtn.innerHTML = `
          <span class="btn-icon">
            __ICON_PLAY__
          </span>
          <span class="action-btn-label">PLAY</span>
        `;
      }
    }

    function updateSoundBtnUI(muted) {
      if (!soundBtn) return;
      if (muted) {
        soundBtn.innerHTML = `
          <span class="btn-icon">
            __ICON_SOUND_MUTE__
          </span>
          <span class="action-btn-label">MUTE</span>
        `;
      } else {
        soundBtn.innerHTML = `
          <span class="btn-icon">
            __ICON_SOUND_AUDIO__
          </span>
          <span class="action-btn-label">AUDIO</span>
        `;
      }
    }

    function updateModeBtnUI(auto) {
      if (!modeBtn) return;
      if (auto) {
        modeBtn.innerHTML = `
          <span class="btn-icon sx-flip-x">
            __ICON_BACK__
          </span>
          <span class="action-btn-label" id="modeLabel">AUTO</span>
        `;
      } else {
        modeBtn.innerHTML = `
          <span class="btn-icon">
            __ICON_MODE_LOOP__
          </span>
          <span class="action-btn-label" id="modeLabel">LOOP</span>
        `;
      }
    }

    video.addEventListener('play', () => updatePlayBtnUI(true));
    video.addEventListener('pause', () => updatePlayBtnUI(false));

    video.addEventListener('loadedmetadata', () => {
      renderCommentMarkers();
    });

    video.addEventListener('error', () => {
      const err = video.error;
      console.error('[ReelsPlayer] Video load error:', err, 'src:', video.src);
      if (!video.src) return;
      
      const isProxy = video.src.includes('-preview.mp4');
      if (window.location.protocol === 'https:' && video.src.startsWith('http:')) {
        showError('HTTPS Mixed Content Blocked: Page is HTTPS but media URL is HTTP. Open app over http://localhost:8501 or use USB Chrome Remote Debugging.');
      } else if (isProxy) {
        console.warn('[ReelsPlayer] Transient error on H.264 proxy stream:', video.src);
      } else if (err && err.code === 4 /* MEDIA_ERR_SRC_NOT_SUPPORTED */) {
        showError('Video format (HEVC) not supported by browser. Select "H.264 4K (Web & VR)" in the Codec filter above.');
      } else {
        showError('Media playback error (Code ' + (err ? err.code : 'unknown') + '). Check media server connection on port 8502.');
      }
    });

    skipErrorBtn.addEventListener('click', () => {
      nextVideo('playback_error');
    });

    // Seek Relative (A / D controls: -5s / +5s)
    function seekRelative(sec) {
      // No timeline on stills — nothing to seek.
      if (isImageItem(videoData[idx])) return;
      if (video.duration) {
        const target = Math.max(0, Math.min(video.duration, video.currentTime + sec));
        video.currentTime = target;
        showFlash((sec > 0 ? '⏩ +' : '⏪ -') + Math.abs(sec) + 's');
      }
    }

    function flashBtn(btn) {
      if (!btn) return;
      btn.classList.add('flash-click');
      setTimeout(() => btn.classList.remove('flash-click'), 180);
    }

    // Toggle Play/Pause
    function togglePlay() {
      flashBtn(playBtn);
      // Stills have no media clock — play/pause gates the 10s dwell timer.
      if (isImageItem(videoData[idx])) {
        if (imageTimer) {
          clearImageTimer();
          updatePlayBtnUI(false);
          showFlash('⏸ PAUSE');
        } else {
          armImageTimer();
          showFlash('▶ PLAY');
        }
        return;
      }
      if (video.paused) {
        video.play().then(() => {
          updatePlayBtnUI(true);
          showFlash('▶ PLAY');
        }).catch(() => {});
      } else {
        video.pause();
        updatePlayBtnUI(false);
        showFlash('⏸ PAUSE');
      }
    }

    // Toggle Sound
    function toggleSound() {
      flashBtn(soundBtn);
      isMuted = !isMuted;
      video.muted = isMuted;
      updateSoundBtnUI(isMuted);
      showFlash(isMuted ? '🔇 MUTED' : '🔊 AUDIO');
    }

    // Toggle Mode
    function toggleMode() {
      if (isPackMode) {
        showFlash('AUTHORED ORDER');
        return;
      }
      flashBtn(modeBtn);
      isAutoNext = !isAutoNext;
      updateModeBtnUI(isAutoNext);
      showFlash(isAutoNext ? '🔄 AUTO' : '🔁 LOOP');
    }

    // Preload the bounded look-ahead window.
    function updatePreloadStatus() {
      const total = Math.min(2, Math.max(0, ((videoData && videoData.length) || 0) - idx - 1));
      const completed = Math.min(preloadedCount, total);
      if (preloadStatus) {
        preloadStatus.textContent = `⚡ ${completed}/${total}`;
        preloadStatus.style.display = 'inline-block';
      }
      if (typeof WebXRVR !== 'undefined' && WebXRVR.onPreloadProgress) {
        WebXRVR.onPreloadProgress(completed, total);
      }
    }

    // Preload only a sliding window of the next 2 reels (current + 1 ahead),
    // NOT every reel. Preloading ALL filtered reels (~210 MiB of blobs on a
    // ~8GB Quest 3S) triggered blob eviction → the active video re-fetched byte
    // ranges over the slow adb-over-USB tunnel mid-playback → stalls. Keeping
    // the resident set to ≤3 blobs sidesteps the eviction entirely. The window
    // is refetched each call so navigating updates the cache.
    async function preloadAllVideos() {
      if (isPreloading || !videoData || videoData.length === 0) return;
      if (feedHasMore && videoData.length - idx - 1 < 2) await fetchNextPage();
      const generation = feedGeneration;
      preloadController = typeof AbortController !== 'undefined' ? new AbortController() : null;
      isPreloading = true;
      if (preloadStatus) preloadStatus.style.display = 'inline-block';
      if (preloadLabel) preloadLabel.textContent = 'LOADING...';
      preloadedCount = 0;
      const total = Math.min(2, Math.max(0, videoData.length - idx - 1));
      updatePreloadStatus();

      for (let off = 1; off <= total; off++) {
        const i = idx + off;
        if (blobUrlMap[i]) {
          preloadedCount++;
          updatePreloadStatus();
          continue;
        }
        try {
          const url = resolveItemUrl(videoData[i]);
          const res = await fetch(url, {
            signal: preloadController ? preloadController.signal : undefined,
          });
          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);
          if (generation !== feedGeneration) {
            URL.revokeObjectURL(blobUrl);
            break;
          }
          blobUrlMap[i] = blobUrl;
          preloadedCount++;
          updatePreloadStatus();
        } catch (e) {
          if (e && e.name === 'AbortError') break;
          console.error('Failed to preload video at index', i, e);
        }
      }
      if (generation === feedGeneration) {
        isPreloading = false;
        preloadController = null;
        if (preloadLabel) preloadLabel.textContent = 'NEXT 2';
      }
    }

    // Navigation
    async function nextVideo(reason) {
      finishViewTracking(reason || 'manual_next');
      if (isPackMode && PackState) {
        if (packUnavailableTimer) {
          clearTimeout(packUnavailableTimer);
          packUnavailableTimer = null;
        }
        packState.index = idx;
        packState = PackState.transition(packState, { type: 'NEXT' });
        if (packState.phase === 'complete') {
          completePack();
          return;
        }
        idx = packState.index;
        loadVideo(idx);
        persistPackProgress(true);
        return;
      }
      if (idx + 1 >= videoData.length && feedHasMore) {
        await fetchNextPage();
      }
      if (idx + 1 < videoData.length) {
        loadVideo(idx + 1);
      } else {
        showFlash('END OF FEED');
      }
    }
    function prevVideo() {
      if (isPackMode && PackState) {
        if (packUnavailableTimer) {
          clearTimeout(packUnavailableTimer);
          packUnavailableTimer = null;
        }
        packState.index = idx;
        const nextState = PackState.transition(packState, { type: 'PREV' });
        if (nextState.index === idx) {
          showFlash('START OF PACK');
          return;
        }
        packState = nextState;
        idx = packState.index;
        loadVideo(idx);
        persistPackProgress(true);
        return;
      }
      if (idx <= 0) {
        showFlash('START OF FEED');
        return;
      }
      finishViewTracking('manual_previous');
      loadVideo(idx - 1);
    }

    function captureOriginalFeed() {
      if (originalFeedSnapshot) return;
      const current = videoData[idx] || null;
      const entryPlayback = earthEntryPlayback || {};
      const wasPlaying = typeof entryPlayback.wasPlaying === 'boolean'
        ? entryPlayback.wasPlaying
        : (isImageItem(current) ? !!imageTimer : !video.paused);
      originalFeedSnapshot = FeedState.capture({
        videoData: videoData.slice(),
        idx,
        feedParams: { ...feedParams },
        feedCursor,
        feedHasMore,
        isAutoNext,
        isMuted,
        currentTime: Number.isFinite(Number(entryPlayback.currentTime))
          ? Number(entryPlayback.currentTime)
          : (isImageItem(current) ? 0 : (video.currentTime || 0)),
        wasPlaying,
      });
    }

    function locationFeedParams(locationRow) {
      return FeedState.locationParams(feedParams, locationRow);
    }

    async function loadLocationHoverPreview(locationRow, options) {
      if (!locationRow || !locationRow.slug) return [];
      const previewOptions = options || {};
      const limit = Math.max(1, Math.min(3, Number(previewOptions.limit) || 3));
      const url = new URL('/api/reels/locations/' + encodeURIComponent(locationRow.slug), location.origin);
      url.searchParams.set('codec', 'h264');
      url.searchParams.set('sort', 'recent_trending');
      url.searchParams.set('window_days', '7');
      const payload = await requestJson(url.pathname + url.search, {
        signal: previewOptions.signal,
      });
      return (Array.isArray(payload && payload.videos) ? payload.videos : [])
        .filter((item) => item && item.media_type === 'video')
        .slice(0, limit)
        .map((item) => ({
          ...item,
          url: resolveItemUrl({ ...item, url: item.preview_url || item.url }),
          preview_url: '',
        }))
        .filter((item) => !!item.url);
    }

    async function switchToLocationFeed(locationRow) {
      if (!locationRow || !locationRow.slug) return false;
      captureOriginalFeed();
      abortFeedWork();
      const generation = feedGeneration;
      const params = locationFeedParams(locationRow);
      feedTransitionController = typeof AbortController !== 'undefined' ? new AbortController() : null;
      showFlash('LOADING ' + String(locationRow.name || locationRow.slug).toUpperCase());
      try {
        const page = await requestJson(feedRequestUrl(null, params), {
          signal: feedTransitionController ? feedTransitionController.signal : undefined,
        });
        if (!FeedState.isCurrent(generation, feedGeneration)) return false;
        const nextState = FeedState.fromPage(page, params, locationRow);
        if (!nextState.videoData.length) {
          showFlash('NO RECENT REELS');
          return false;
        }
        finishViewTracking('location_feed_switch');
        clearImageTimer();
        clearBlobCache();
        try { video.pause(); } catch (e) {}
        videoData = nextState.videoData;
        feedParams = nextState.feedParams;
        feedCursor = nextState.feedCursor;
        feedHasMore = nextState.feedHasMore;
        activeLocationFeed = nextState.activeLocationFeed;
        idx = nextState.idx;
        preloadedCount = 0;
        loadVideo(0, { autoplay: true });
        showFlash('📍 ' + String(activeLocationFeed.name).toUpperCase());
        return true;
      } catch (error) {
        if (error && error.name === 'AbortError') return false;
        console.error('[ReelsPlayer] Location feed failed:', error);
        showFlash('LOCATION FEED ERROR');
        throw error;
      } finally {
        if (FeedState.isCurrent(generation, feedGeneration)) feedTransitionController = null;
      }
    }

    async function restoreAllLocations() {
      if (!originalFeedSnapshot) return false;
      const snapshot = FeedState.restore(originalFeedSnapshot);
      finishViewTracking('restore_all_locations');
      abortFeedWork();
      clearImageTimer();
      clearBlobCache();
      try { video.pause(); } catch (e) {}
      videoData = snapshot.videoData.slice();
      feedParams = { ...snapshot.feedParams };
      feedCursor = snapshot.feedCursor || null;
      feedHasMore = !!snapshot.feedHasMore;
      isAutoNext = !!snapshot.isAutoNext;
      isMuted = !!snapshot.isMuted;
      activeLocationFeed = null;
      originalFeedSnapshot = null;
      earthEntryPlayback = null;
      preloadedCount = 0;
      updateModeBtnUI(isAutoNext);
      updateSoundBtnUI(isMuted);
      loadVideo(Math.max(0, Math.min(snapshot.idx, videoData.length - 1)), {
        autoplay: snapshot.wasPlaying,
        seekTo: snapshot.currentTime,
      });
      showFlash('ALL LOCATIONS');
      return true;
    }

    function resumeAfterEarth(shouldResume) {
      if (!shouldResume) return;
      const item = videoData[idx];
      if (isImageItem(item)) {
        if (!imageTimer) armImageTimer();
      } else if (video && video.paused) {
        video.play().catch(() => {});
      }
    }

    // Button Listeners (play/prev/next rail buttons were removed; the
    // functions remain bound to keyboard, video-tap, and edge chevrons)
    if (playBtn) playBtn.addEventListener('click', togglePlay);
    soundBtn.addEventListener('click', toggleSound);
    modeBtn.addEventListener('click', toggleMode);
    if (nextBtn) nextBtn.addEventListener('click', nextVideo);
    if (prevBtn) prevBtn.addEventListener('click', prevVideo);
    if (edgeNextBtn) edgeNextBtn.addEventListener('click', () => { flashEdge(edgeNextBtn); nextVideo(); });
    if (edgePrevBtn) edgePrevBtn.addEventListener('click', () => { flashEdge(edgePrevBtn); prevVideo(); });
    if (moreBtn) moreBtn.addEventListener('click', () => setRailOverflow(true));
    if (railBackBtn) railBackBtn.addEventListener('click', () => setRailOverflow(false));
    if (preloadBtn) preloadBtn.addEventListener('click', preloadAllVideos);

    // Rail overflow: swap the primary cluster for the overflow cluster.
    // Tapping the video dismisses the overflow (see videoWrap handler).
    function setRailOverflow(open) {
      if (railPrimary) railPrimary.hidden = open;
      if (railMore) railMore.hidden = !open;
    }
    function isRailOverflowOpen() {
      return !!(railMore && !railMore.hidden);
    }
    function flashEdge(btn) {
      if (!btn) return;
      btn.style.borderColor = '#FF3B1F';
      btn.style.color = '#FF3B1F';
      setTimeout(() => { btn.style.borderColor = ''; btn.style.color = ''; }, 180);
    }

    // Marker class for "any fullscreen mode is active" (real fullscreen
    // targets the frame's PARENT, so :fullscreen never matches the frame
    // itself — CSS that must apply in real fullscreen keys off this class).
    function syncFsActiveClass() {
      if (!frame) return;
      try {
        frame.classList.toggle('sx-fs-active', isCurrentFullscreen());
      } catch (e) {}
      positionEdgeNav();
    }

    function togglePseudoFullscreen(enable) {
      const fsTarget = frame.parentElement || frame;
      if (enable) {
        fsTarget.classList.add('sx-pseudo-fullscreen');
        frame.classList.add('sx-pseudo-fullscreen');
        document.documentElement.classList.add('sx-vr-active');
        if (document.body) document.body.classList.add('sx-vr-active');
        window.dispatchEvent(new CustomEvent('echo:fullscreen-enter'));
        try { if (window.top && window.top !== window) window.top.dispatchEvent(new CustomEvent('echo:fullscreen-enter')); } catch (e2) {}
      } else {
        resetPan();
        fsTarget.classList.remove('sx-pseudo-fullscreen');
        frame.classList.remove('sx-pseudo-fullscreen');
        document.documentElement.classList.remove('sx-vr-active');
        if (document.body) document.body.classList.remove('sx-vr-active');
        window.dispatchEvent(new CustomEvent('echo:fullscreen-exit'));
        try { if (window.top && window.top !== window) window.top.dispatchEvent(new CustomEvent('echo:fullscreen-exit')); } catch (e2) {}
      }
      syncFsActiveClass();
    }

    fullBtn.addEventListener('click', () => {
      const fsTarget = frame.parentElement || frame;
      if (fsTarget.classList.contains('sx-pseudo-fullscreen') || frame.classList.contains('sx-pseudo-fullscreen')) {
        togglePseudoFullscreen(false);
        return;
      }
      if (!document.fullscreenElement) {
        // Fullscreen the frame's PARENT (host div in the SPA, body
        // standalone): author CSS cannot size a :fullscreen element
        // itself (browser forces its box), but it CAN center the frame
        // inside a fullscreen parent with normal flex layout.
        if (fsTarget.requestFullscreen) {
          fsTarget.requestFullscreen().catch(() => {
            togglePseudoFullscreen(true);
          });
        } else if (frame.requestFullscreen) {
          frame.requestFullscreen().catch(() => {
            togglePseudoFullscreen(true);
          });
        } else {
          togglePseudoFullscreen(true);
        }
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // ── Fullscreen Pan & Scan Logic ──
    let panX = 0;
    let isPanning = false;
    let wasPanning = false;
    let panStartX = 0;
    let panInitialX = 0;

    function isCurrentFullscreen() {
      const fsTarget = frame.parentElement || frame;
      return !!document.fullscreenElement ||
             frame.classList.contains('sx-pseudo-fullscreen') ||
             (fsTarget && fsTarget.classList.contains('sx-pseudo-fullscreen'));
    }

    function getMaxPan() {
      if (!isCurrentFullscreen()) return 0;
      const activeMedia = (reelsImage && reelsImage.style.display !== 'none') ? reelsImage : video;
      const mediaRect = activeMedia.getBoundingClientRect();
      const frameRect = frame.getBoundingClientRect();
      if (mediaRect.width > frameRect.width) {
        return (mediaRect.width - frameRect.width) / 2;
      }
      return 0;
    }

    function applyPan(x, animate) {
      const maxPan = getMaxPan();
      panX = Math.max(-maxPan, Math.min(maxPan, x));
      const transformVal = `translate3d(${panX}px, 0, 0)`;
      const transitionVal = animate ? 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)' : 'none';
      if (video) {
        video.style.transition = transitionVal;
        video.style.transform = transformVal;
      }
      if (reelsImage) {
        reelsImage.style.transition = transitionVal;
        reelsImage.style.transform = transformVal;
      }
    }

    function resetPan() {
      panX = 0;
      applyPan(0, true);
    }

    window.__sxReelsPan = {
      applyPan,
      resetPan,
      getMaxPan,
      getPanX: () => panX,
      isCurrentFullscreen
    };

    window.addEventListener('resize', () => {
      if (isCurrentFullscreen()) {
        applyPan(panX, false);
      } else if (panX !== 0) {
        resetPan();
      }
    });

    // Desktop Mouse Drag Panning
    const vWrap = document.getElementById('videoWrap');
    if (vWrap) {
      vWrap.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        if (commentsDrawer && commentsDrawer.classList.contains('open')) return;
        if (!isCurrentFullscreen() || getMaxPan() <= 0) return;
        isPanning = true;
        panStartX = e.clientX;
        panInitialX = panX;
        frame.classList.add('panning');
        e.preventDefault();
      });
    }

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      const dx = e.clientX - panStartX;
      if (Math.abs(dx) > 4) {
        wasPanning = true;
      }
      applyPan(panInitialX + dx, false);
    });

    window.addEventListener('mouseup', () => {
      if (isPanning) {
        isPanning = false;
        frame.classList.remove('panning');
        setTimeout(() => {
          wasPanning = false;
        }, 150);
      }
    });

    // ── Fullscreen ↔ Host SPA bridge — hide site chrome for immersive Reels ──
    function notifyFsChange() {
      const isFs = !!document.fullscreenElement;
      const target = document.fullscreenElement;
      syncFsActiveClass();
      const isReelsFs = !!target && (
        target.id === 'reelsFrame' ||
        target.id === 'sxReelsRoot' ||
        (target.closest && (target.closest('#sxReelsRoot') || target.closest('#reelsFrame'))) ||
        (target.querySelector && (target.querySelector('#reelsFrame') || target.querySelector('#sxReelsRoot')))
      );
      if (isFs && isReelsFs) {
        try {
          window.dispatchEvent(new CustomEvent('echo:fullscreen-enter'));
          try { if (window.top && window.top !== window) window.top.dispatchEvent(new CustomEvent('echo:fullscreen-enter')); } catch (e2) {}
          document.documentElement.classList.add('sx-vr-active');
          if (document.body) document.body.classList.add('sx-vr-active');
        } catch (e) {}
      } else if (!isFs) {
        resetPan();
        try {
          window.dispatchEvent(new CustomEvent('echo:fullscreen-exit'));
          try { if (window.top && window.top !== window) window.top.dispatchEvent(new CustomEvent('echo:fullscreen-exit')); } catch (e2) {}
          // Only clear if not also in WebXR (WebXR cleanup also clears, but keep safe)
          document.documentElement.classList.remove('sx-vr-active');
          if (document.body) document.body.classList.remove('sx-vr-active');
        } catch (e) {}
      }
    }
    document.addEventListener('fullscreenchange', notifyFsChange);
    document.addEventListener('webkitfullscreenchange', notifyFsChange);

    // Click on video area toggles play/pause (unless drawer is clicked or user just panned).
    // An open rail overflow is dismissed first instead of toggling playback.
    document.getElementById('videoWrap').addEventListener('click', (e) => {
      if (wasPanning) return;
      if (e.target.tagName === 'VIDEO' || e.target.tagName === 'IMG' || e.target.id === 'videoWrap') {
        if (isRailOverflowOpen()) {
          setRailOverflow(false);
        } else if (commentsDrawer && commentsDrawer.classList.contains('open')) {
          toggleDrawer(false);
        } else {
          togglePlay();
        }
      }
    });

    // Page-edge prev/next chevrons: fixed to the viewport's right edge,
    // vertically centered on the player window (tracked, not 50vh, so they
    // follow the frame in the SPA embed). Hidden when the player is off-screen.
    // In fullscreen the frame rect IS the viewport, so this degrades to 50vh.
    let edgeNavInView = true;
    function positionEdgeNav() {
      if (!edgeNav || !frame) return;
      const rect = frame.getBoundingClientRect();
      const onScreen = rect.bottom > 0 && rect.top < window.innerHeight && rect.height > 0;
      const show = onScreen && edgeNavInView;
      edgeNav.hidden = !show;
      if (!show) return;
      const mid = rect.top + rect.height / 2;
      edgeNav.style.top = Math.min(Math.max(mid, 70), window.innerHeight - 70) + 'px';
    }
    let edgeNavObserver = null;
    if (edgeNav && frame && typeof IntersectionObserver !== 'undefined') {
      edgeNavObserver = new IntersectionObserver(
        (entries) => {
          edgeNavInView = !!(entries[0] && entries[0].isIntersecting);
          positionEdgeNav();
        },
        { threshold: 0 },
      );
      edgeNavObserver.observe(frame);
    }
    window.addEventListener('scroll', positionEdgeNav, { passive: true, capture: true });
    window.addEventListener('resize', positionEdgeNav);
    document.addEventListener('fullscreenchange', positionEdgeNav);
    document.addEventListener('webkitfullscreenchange', positionEdgeNav);
    positionEdgeNav();
    syncFsActiveClass();
    // ReelsPlayer.jsx re-injects this script on param change and calls this
    // hook on teardown — release the window-level listeners + observer.
    window.__sxReelsCleanup = function () {
      window.removeEventListener('scroll', positionEdgeNav, { capture: true });
      window.removeEventListener('resize', positionEdgeNav);
      document.removeEventListener('fullscreenchange', positionEdgeNav);
      document.removeEventListener('webkitfullscreenchange', positionEdgeNav);
      if (edgeNavObserver) {
        try { edgeNavObserver.disconnect(); } catch (e) {}
        edgeNavObserver = null;
      }
      window.__sxReelsCleanup = null;
    };

    // Video Ended -> Auto-advance or Loop
    video.addEventListener('ended', () => {
      finishViewTracking('complete');
      if (isAutoNext) {
        nextVideo('autoplay');
      } else {
        video.currentTime = 0;
        startViewTracking(videoData[idx]);
        video.play().catch(() => {});
      }
    });

    // Update Progress Bar & Time-Synced Overlays
    video.addEventListener('timeupdate', () => {
      schedulePackProgress();
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressFill.style.width = pct + '%';
        timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        if (syncTimeDisplay) syncTimeDisplay.textContent = formatTime(video.currentTime);
        if (isSyncTimeActive && commentInput && !commentInput.value) {
          commentInput.placeholder = `Add a comment at ${formatTime(video.currentTime)}...`;
        }
      }
      updateTwitchTicker();
    });

    // Seek on progress bar click
    progressBar.parentElement.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      if (video.duration) {
        video.currentTime = pos * video.duration;
      }
    });

    // Mouse Wheel Scroll: Horizontal Pan in Fullscreen or Vertical Reel Switch
    let scrollTimeout;
    frame.addEventListener('wheel', (e) => {
      if (commentsDrawer && commentsDrawer.classList.contains('open')) return;
      if (isCurrentFullscreen() && Math.abs(e.deltaX) > Math.abs(e.deltaY) && Math.abs(e.deltaX) > 5) {
        e.preventDefault();
        applyPan(panX - e.deltaX, false);
        return;
      }
      e.preventDefault();
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => {
        if (e.deltaY > 20) {
          nextVideo();
        } else if (e.deltaY < -20) {
          prevVideo();
        }
      }, 50);
    }, { passive: false });

    // Touch Gestures: Horizontal Pan in Fullscreen, Vertical Swipe for Navigation
    let touchStartX = 0;
    let touchStartY = 0;
    let touchMode = null; // 'pan' | 'swipe' | null
    let touchPanned = false;

    frame.addEventListener('touchstart', (e) => {
      if (commentsDrawer && commentsDrawer.classList.contains('open')) return;
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        panStartX = touchStartX;
        panInitialX = panX;
        touchMode = null;
        touchPanned = false;
      }
    }, { passive: true });

    frame.addEventListener('touchmove', (e) => {
      if (commentsDrawer && commentsDrawer.classList.contains('open')) return;
      if (e.touches.length === 1) {
        const curX = e.touches[0].clientX;
        const curY = e.touches[0].clientY;
        const dx = curX - touchStartX;
        const dy = curY - touchStartY;

        // Disambiguate axis if not locked yet
        if (!touchMode) {
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
            if (Math.abs(dx) > Math.abs(dy) && isCurrentFullscreen() && getMaxPan() > 0) {
              touchMode = 'pan';
              frame.classList.add('panning');
            } else {
              touchMode = 'swipe';
            }
          }
        }

        if (touchMode === 'pan') {
          touchPanned = true;
          const targetPan = panInitialX + (curX - panStartX);
          applyPan(targetPan, false);
          if (e.cancelable) e.preventDefault();
        }
      }
    }, { passive: false });

    frame.addEventListener('touchend', (e) => {
      frame.classList.remove('panning');
      if (commentsDrawer && commentsDrawer.classList.contains('open')) return;
      if (touchMode === 'pan') {
        if (touchPanned) {
          wasPanning = true;
          setTimeout(() => { wasPanning = false; }, 200);
        }
        touchMode = null;
        return;
      }
      if (e.changedTouches.length > 0) {
        const touchEndY = e.changedTouches[0].clientY;
        const diffY = touchStartY - touchEndY;
        if (diffY > 50) {
          nextVideo(); // Swipe Up -> Next
        } else if (diffY < -50) {
          prevVideo(); // Swipe Down -> Prev
        }
      }
      touchMode = null;
    }, { passive: true });

    // Keyboard controls
    window.addEventListener('keydown', (e) => {
      // Don't capture shortcuts when typing in comment input
      if (e.target && e.target.tagName === 'INPUT') {
        if (e.key === 'Escape') {
          if (collectOpen) {
            hideCollectNewRow();
            return;
          }
          toggleDrawer(false);
        }
        return;
      }
      const key = e.key.toLowerCase();
      if (key === 'escape') {
        if (collectOpen) {
          closeCollectOverlay();
          try { if (saveBtn && !saveBtn.closest('[hidden]')) saveBtn.focus({ preventScroll: true }); else moreBtn && moreBtn.focus({ preventScroll: true }); } catch (focusError) {}
          return;
        }
        if (isPackMode && packQueueOpen) {
          setPackQueue(false);
          try { packQueueBtn.focus({ preventScroll: true }); } catch (focusError) {}
          return;
        }
        toggleDrawer(false);
        const fsTarget = frame.parentElement || frame;
        if (fsTarget.classList.contains('sx-pseudo-fullscreen') || frame.classList.contains('sx-pseudo-fullscreen')) {
          togglePseudoFullscreen(false);
        }
      } else if (key === 'c') {
        e.preventDefault();
        toggleDrawer();
      } else if (key === 'w' || key === 'arrowup' || key === 'p') {
        e.preventDefault();
        prevVideo();
      } else if (key === 's' || key === 'arrowdown' || key === 'n') {
        e.preventDefault();
        nextVideo();
      } else if (key === 'a' || key === 'arrowleft') {
        e.preventDefault();
        seekRelative(-5);
      } else if (key === 'd' || key === 'arrowright') {
        e.preventDefault();
        seekRelative(5);
      } else if (key === ' ' || key === 'k') {
        e.preventDefault();
        togglePlay();
      } else if (key === 'm') {
        e.preventDefault();
        toggleSound();
      } else if (key === 'l') {
        e.preventDefault();
        preloadAllVideos();
      } else if (key === 'f') {
        e.preventDefault();
        likeCurrentReel();
      }
    });

    // Focus frame on click for direct keyboard capture
    frame.focus();

    // ── WebXR VR Integration ──
    const vrBtnWrap = document.getElementById('vrBtnWrap');
    const vrBtn = document.getElementById('vrBtn');

    if (typeof WebXRVR !== 'undefined') {
      WebXRVR.init(video, {
        onNext: nextVideo,
        onPrev: prevVideo,
        onTogglePlay: togglePlay,
        onToggleMode: toggleMode,
        onSeek: seekRelative,
        onToggleMute: toggleSound,
        getVisualSource: currentVisualSource,
        isPackMode: function() { return isPackMode; },
        getPackContext: function() {
          if (!isPackMode || !packState.pack) return null;
          return {
            id: packState.pack.id,
            title: packState.pack.title,
            creator: packCreatorLabel(),
            index: idx,
            total: videoData.length,
            phase: packState.phase,
            queueOpen: packQueueOpen,
            saved: !!packState.pack.saved_by_me,
          };
        },
        onTogglePackQueue: function() { return setPackQueue(); },
        onMainScreenSelect: handleCardSelect,
        onSavePack: togglePackSave,
        onSharePack: shareCurrentPack,
        onCollectReel: function() { return openCollectOverlay(); },
        onLike: likeCurrentReel,
        onSaveReel: saveCurrentReel,
        onShareReel: shareCurrentReel,
        onFollow: followCurrentCreator,
        onOpenCurrentProfile: function() {
          const creator = videoData[idx] && videoData[idx].creator;
          if (creator && creator.username) openProfile(creator.username);
        },
        onReportReel: function() { return reportTarget('post', videoData[idx] && videoData[idx].post_id); },
        getCurrentItemState: function() {
          const item = videoData[idx] || {};
          return { liked: !!item._liked, saved: !!item._saved, following: !!item._following, available: item.available !== false };
        },
        onUnmute: function() {
          isMuted = false;
          if (soundBtn) {
            soundBtn.textContent = '🔊';
            soundBtn.classList.add('active');
          }
        },
        onMuteChange: function(muted) {
          isMuted = muted;
          if (soundBtn) {
            soundBtn.textContent = isMuted ? '🔇' : '🔊';
            if (isMuted) soundBtn.classList.remove('active');
            else soundBtn.classList.add('active');
          }
          showFlash(isMuted ? '🔇' : '🔊');
        },
        getPlaylist: function() { return videoData; },
        getCurrentIndex: function() { return idx; },
        getAutoNext: function() { return isAutoNext; },
        isLocationFeedActive: function() { return !!activeLocationFeed; },
        onEarthOpen: function(wasPlaying) {
          const imageWasAdvancing = isImageItem(videoData[idx]) && !!imageTimer;
          earthEntryPlayback = {
            wasPlaying: imageWasAdvancing || !!wasPlaying,
            currentTime: isImageItem(videoData[idx]) ? 0 : (video.currentTime || 0),
          };
          if (imageWasAdvancing) clearImageTimer();
          return earthEntryPlayback.wasPlaying;
        },
        onEarthClose: function(shouldResume) {
          if (!activeLocationFeed && feedTransitionController) abortFeedWork();
          resumeAfterEarth(shouldResume);
        },
        onPreviewLocation: loadLocationHoverPreview,
        onSelectLocation: function(locationRow) { return switchToLocationFeed(locationRow); },
        onRestoreAllLocations: restoreAllLocations,
        getComments: function() { return getCurrentComments(); },
        getCurrentUser: function() { return currentUser; },
        onOpenAccount: function() {
          if (currentUser) openProfile(currentUser.username);
          else requestAuthentication({ kind: 'account' });
        },
        onOpenProfile: function(username) { openProfile(username); },
        onSeekTo: function(t) {
          if (video && video.duration && !isNaN(t)) {
            const target = Math.max(0, Math.min(video.duration, t));
            video.currentTime = target;
            showFlash('⏱️ ' + formatTime(target));
          }
        },
        onLikeComment: function(id) { return likeComment(id); },
        onPostComment: function(text, timestamp) { return postComment(text, timestamp); },
      });

      // Per Meta WebXR guidance, only offer the immersive session when the
      // runtime reports support — don't infer it from script presence.
      if (vrBtnWrap && packImmersiveEnabled && typeof WebXRVR.isSupported === 'function') {
        WebXRVR.isSupported().then((supported) => {
          if (supported) vrBtnWrap.style.display = '';
        }).catch(() => {});
      }

      if (vrBtn) {
        vrBtn.addEventListener('click', function() {
          if (!packImmersiveEnabled) {
            showFlash('PACK VR DISABLED');
            return;
          }
          // Avoid background preload contending with the XR decoder/texture
          // upload path for the active pack item.
          try { clearPreloadVideo(); } catch (e) {}
          WebXRVR.enterVR();
        });
      }
    }

    // ── 2D Viewport Ambient Glow Sampler ──
    const glowEl = document.getElementById('reelsAmbientGlow');
    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 4;
    glowCanvas.height = 4;
    const glowCtx = glowCanvas.getContext('2d', { willReadFrequently: true });

    function updateDesktopGlow() {
      if (!video || video.paused || video.readyState < 2 || !glowEl || document.hidden) return;
      try {
        if (typeof WebXRVR !== 'undefined' && WebXRVR.isPresenting && WebXRVR.isPresenting()) return;
      } catch (e) {}
      try {
        glowCtx.drawImage(video, 0, 0, 4, 4);
        const data = glowCtx.getImageData(0, 0, 4, 4).data;
        let r = 0, g = 0, b = 0;
        for (let i = 0; i < data.length; i += 4) {
          r += data[i];
          g += data[i + 1];
          b += data[i + 2];
        }
        r = Math.min(255, Math.round((r / 16) * 1.3 + 5));
        g = Math.min(255, Math.round((g / 16) * 1.3 + 10));
        b = Math.min(255, Math.round((b / 16) * 1.4 + 20));
        glowEl.style.background = `radial-gradient(circle at center, rgba(${r}, ${g}, ${b}, 0.75) 0%, rgba(2, 6, 18, 0) 75%)`;
      } catch (e) {}
    }
    if (window.__sxGlowInterval) clearInterval(window.__sxGlowInterval);
    window.__sxGlowInterval = setInterval(updateDesktopGlow, 140);

    window.__sxReelsRuntimeCleanup = function () {
      if (isPackMode && packState.phase === 'playing') persistPackProgress(true);
      finishViewTracking('unload');
      abortFeedWork();
      clearImageTimer();
      clearBlobCache();
      if (packProgressTimer) {
        clearTimeout(packProgressTimer);
        packProgressTimer = null;
      }
      if (packUnavailableTimer) {
        clearTimeout(packUnavailableTimer);
        packUnavailableTimer = null;
      }
      if (tickerHideTimer) clearTimeout(tickerHideTimer);
      if (rewardToastTimer) clearTimeout(rewardToastTimer);
      if (rewardToast) rewardToast.classList.remove('show');
      try {
        if (typeof WebXRVR !== 'undefined' && WebXRVR.exitVR) WebXRVR.exitVR();
      } catch (e) {}
      document.removeEventListener('fullscreenchange', notifyFsChange);
      document.removeEventListener('webkitfullscreenchange', notifyFsChange);
    };

    // Initial Load
    if (isPackMode) {
      syncPackChrome();
      recordPackEvent('pack_open');
      if (!videoData.length) {
        packState.phase = 'complete';
        showPackStage('complete');
      } else if (packState.phase === 'complete') {
        startPackPlayback(true);
      } else {
        const resumeSeconds = Math.max(0, Number(packState.resumePositionMs) || 0) / 1000;
        loadVideo(packState.index, { autoplay: true, seekTo: resumeSeconds });
        recordPackEvent(resumeSeconds > 0 ? 'pack_resume' : 'pack_start');
      }
    } else if (videoData.length) loadVideo(0);
    else showError('No recommendations are currently available.');
    loadCurrentUser();
  })();
</script>
</body>
</html>
