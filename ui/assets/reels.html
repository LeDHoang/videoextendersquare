    const drawerTitle = document.getElementById('drawerTitle');
    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const commentsList = document.getElementById('commentsList');
    const tabAll = document.getElementById('tabAll');
    const tabSync = document.getElementById('tabSync');
    const tabGeneral = document.getElementById('tabGeneral');
    const accountBtn = document.getElementById('accountBtn');
    const accountAvatar = document.getElementById('accountAvatar');
    const accountName = document.getElementById('accountName');
    const syncTimeToggle = document.getElementById('syncTimeToggle');
    const syncTimeDisplay = document.getElementById('syncTimeDisplay');
    const commentForm = document.getElementById('commentForm');
    const commentInput = document.getElementById('commentInput');
    const commentSubmitBtn = document.getElementById('commentSubmitBtn');

    const blobUrlMap = {};
    let isPreloading = false;
    let preloadedCount = 0;

    function isImageItem(item) {
      return !!item && item.media_type === 'image';
    }

    function clearImageTimer() {
      if (imageTimer) {
        clearTimeout(imageTimer);
        imageTimer = null;
      }
      window.__sxImageTimer = null;
    }

    // Hold the still for IMAGE_DWELL_S, then auto-advance (or re-hold on LOOP).
    function armImageTimer() {
      clearImageTimer();
      updatePlayBtnUI(true);
      // timeDisplay is initialized before the first loadVideo() call below.
      if (timeDisplay) timeDisplay.textContent = '0:00 / 0:10';
      imageTimer = setTimeout(() => {
        imageTimer = null;
        finishViewTracking('complete');
        if (isAutoNext) nextVideo('autoplay');
        else {
          startViewTracking(videoData[idx]);
          armImageTimer();
        }
      }, IMAGE_DWELL_S * 1000);
      window.__sxImageTimer = imageTimer;
    }

    function formatTime(seconds) {
      if (seconds === null || seconds === undefined || isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function showFlash(icon) {
      centerFlash.textContent = icon;
      centerFlash.classList.add('show');
      setTimeout(() => centerFlash.classList.remove('show'), 400);
    }

    function hideError() {
      errorOverlay.classList.remove('show');
    }

    function showError(msg) {
      if (msg) document.getElementById('errorText').textContent = msg;
      errorOverlay.classList.add('show');
    }

    const preloadVideo = document.getElementById('preloadVideo');

    function clearPreloadVideo() {
      if (!preloadVideo) return;
      try {
        preloadVideo.pause();
        preloadVideo.removeAttribute('src');
        preloadVideo.load();
      } catch (e) {}
    }

    function resolveItemUrl(item) {
      if (!item || !item.url) return '';
      let itemUrl = item.url;
      if (item.tunnel_url && item.tunnel_url.trim()) {
        const tBase = item.tunnel_url.trim().replace(/\/+$/, '');
        itemUrl = itemUrl.replace(/http:\/\/[^/]+:8502/, tBase);
      } else if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        itemUrl = itemUrl.replace(/http:\/\/[0-9.]+:8502\//, 'http://' + location.hostname + ':8502/');
      } else if (location.protocol === 'http:') {
        itemUrl = itemUrl.replace(/http:\/\/[0-9.]+:8502\//, 'http://' + location.hostname + ':8502/');
      }
      return itemUrl;
    }

    function getCurrentComments() {
      const item = videoData[idx];
      return (item && item.comments) ? item.comments : [];
    }

    function getCookie(name) {
      const prefix = name + '=';
      const row = document.cookie.split('; ').find((part) => part.startsWith(prefix));
      return row ? decodeURIComponent(row.slice(prefix.length)) : '';
    }

    function safeColor(value, fallback) {
      return /^#[0-9a-f]{6}$/i.test(String(value || '')) ? value : (fallback || '#ff553a');
    }

    function eventId() {
      try {
        if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
      } catch (e) {}
      return 'evt-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    async function requestJson(path, options) {
      const requestOptions = { credentials: 'include', ...(options || {}) };
      const method = String(requestOptions.method || 'GET').toUpperCase();
      const headers = new Headers(requestOptions.headers || {});
      if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
        const csrf = getCookie('echo_csrf');
        if (csrf) headers.set('X-CSRF-Token', csrf);
      }
      requestOptions.headers = headers;
      const response = await fetch(path, requestOptions);
      let body = null;
      try { body = await response.json(); } catch (e) {}
      if (!response.ok) {
        const detail = body && body.detail ? body.detail : body;
        const err = new Error(
          (detail && typeof detail === 'object' && detail.message) ||
          (typeof detail === 'string' && detail) ||
          response.statusText ||
          'Request failed'
        );
        err.status = response.status;
        err.code = detail && typeof detail === 'object' ? detail.code : null;
        throw err;
      }
      return body;
    }

    function packCreatorLabel() {
      const creator = packState.pack && packState.pack.creator;
      return creator && creator.username ? '@' + creator.username : 'ECHO CREATOR';
    }

    function currentVisualSource() {
      const item = videoData[idx] || null;
      if (collectOpen) {
        return {
          kind: 'static-card',
          element: packVisualCanvas,
          ready: !!packVisualCanvas,
          paused: true,
          muted: true,
          currentTime: 0,
          duration: 0,
          version: packVisualVersion,
        };
      }
      if (isPackMode && (packQueueOpen || packState.phase !== 'playing' || !item || item.available === false)) {
        return {
          kind: 'static-card',
          element: packVisualCanvas,
          ready: !!packVisualCanvas,
          paused: true,
          muted: true,
          currentTime: 0,
          duration: 0,
          version: packVisualVersion,
        };
      }
      if (isImageItem(item)) {
        return {
          kind: 'image',
          element: reelsImage,
          ready: !!(reelsImage && reelsImage.complete && reelsImage.naturalWidth),
          paused: !imageTimer,
          muted: true,
          currentTime: 0,
          duration: IMAGE_DWELL_S,
          version: String(reelsImage && reelsImage.currentSrc || ''),
        };
      }
      return {
        kind: 'video',
        element: video,
        ready: !!(video && video.readyState >= 2),
        paused: !video || video.paused,
        muted: !video || video.muted,
        currentTime: video ? video.currentTime || 0 : 0,
        duration: video && Number.isFinite(video.duration) ? video.duration : 0,
        version: String(video && video.currentSrc || ''),
      };
    }

    function notifyVisualSourceChange() {
      if (typeof WebXRVR !== 'undefined' && WebXRVR.onVideoChange) WebXRVR.onVideoChange();
    }

    function wrapPackCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const words = String(text || '').split(/\s+/).filter(Boolean);
      let line = '';
      let lineNo = 0;
      for (let i = 0; i < words.length && lineNo < maxLines; i += 1) {
        const trial = line ? line + ' ' + words[i] : words[i];
        if (ctx.measureText(trial).width > maxWidth && line) {
          ctx.fillText(line, x, y + lineNo * lineHeight);
          line = words[i];
          lineNo += 1;
        } else line = trial;
      }
      if (lineNo < maxLines && line) ctx.fillText(line, x, y + lineNo * lineHeight);
    }

    function addPackVisualRegion(action, x, y, w, h, extra) {
      packVisualRegions.push({ action, x: x / 1024, y: y / 1024, w: w / 1024, h: h / 1024, ...(extra || {}) });
    }

    function drawPackCanvasButton(ctx, label, x, y, w, h, primary, action, extra) {
      ctx.fillStyle = primary ? '#ff553a' : '#171b21';
      ctx.strokeStyle = primary ? '#ff765f' : '#69727d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = primary ? '#080a0d' : '#ffffff';
      ctx.font = '900 24px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x + w / 2, y + h / 2);
      addPackVisualRegion(action, x, y, w, h, extra);
    }

    function renderPackVisual(mode) {
      if (!isPackMode || !packVisualCanvas) return;
      if (mode === 'collect') { renderCollectVisual(); return; }
      packVisualMode = mode;
      packVisualRegions = [];
      const ctx = packVisualCanvas.getContext('2d');
      const pack = packState.pack || {};
      ctx.clearRect(0, 0, 1024, 1024);
      const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
      gradient.addColorStop(0, '#1c0d0b');
      gradient.addColorStop(0.48, '#09101c');
      gradient.addColorStop(1, '#05080e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#ff553a';
      ctx.lineWidth = 5;
      ctx.strokeRect(34, 34, 956, 956);
      ctx.fillStyle = '#ff765f';
      ctx.font = '900 24px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(mode === 'queue' ? 'REEL PACK QUEUE' : 'REEL PACK', 512, 104);

      if (mode === 'queue') {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 42px "Archivo", sans-serif';
        ctx.fillText(String(pack.title || 'Untitled Pack').slice(0, 34), 512, 158);
        ctx.fillStyle = '#aeb7c3';
        ctx.font = '700 21px "JetBrains Mono", monospace';
        ctx.fillText('CURATED BY ' + packCreatorLabel() + ' · ' + videoData.length + ' REELS', 512, 196);
        const rowX = 92, rowW = 840, rowH = 48, rowGap = 5, rowStart = 220;
        // Draft owners get a publish row above the action bar; trim the
        // visible queue rows so the two never overlap.
        const canPublishQueue = !!(pack.viewer_state && pack.viewer_state.can_edit) && pack.status === 'draft';
        const maxRows = canPublishQueue ? 10 : 12;
        videoData.slice(0, maxRows).forEach((item, index) => {
          const y = rowStart + index * (rowH + rowGap);
          const current = index === idx;
          const available = item && item.available !== false;
          ctx.fillStyle = current ? '#2a1815' : '#11161d';
          ctx.strokeStyle = current ? '#ff553a' : '#303945';
          ctx.lineWidth = current ? 3 : 1;
          ctx.fillRect(rowX, y, rowW, rowH);
          ctx.strokeRect(rowX, y, rowW, rowH);
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = available ? '#ffffff' : '#777f89';
          ctx.font = '800 19px "JetBrains Mono", monospace';
          ctx.fillText(String(index + 1).padStart(2, '0'), rowX + 18, y + rowH / 2);
          ctx.font = '700 20px "Archivo", sans-serif';
          const name = available ? (item.title || item.filename || 'Untitled reel') : 'Reel unavailable';
          ctx.fillText(String(name).slice(0, 50), rowX + 76, y + rowH / 2);
          ctx.textAlign = 'right';
          ctx.font = '800 16px "JetBrains Mono", monospace';
          ctx.fillText(available ? (current ? 'NOW PLAYING' : 'PLAY') : 'SKIPPED', rowX + rowW - 18, y + rowH / 2);
          if (available) addPackVisualRegion('select', rowX, y, rowW, rowH, { index });
        });
        if (videoData.length > maxRows) {
          ctx.fillStyle = '#aeb7c3';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'alphabetic';
          ctx.font = '700 18px "JetBrains Mono", monospace';
          ctx.fillText('+' + (videoData.length - maxRows) + ' MORE · FULL LIST IN THE PACK DETAILS', 512, 868);
        }
        if (canPublishQueue) {
          const queuePlayable = videoData.filter((row) => row && row.available !== false && row.media_type !== 'static').length;
          if (queuePlayable >= 3) {
            drawPackCanvasButton(ctx, 'PUBLISH COLLECTION', 337, 796, 350, 64, false, 'publish-pack');
          } else {
            ctx.fillStyle = '#767d86';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 19px "JetBrains Mono", monospace';
            ctx.fillText('PUBLISH AT 3+ AVAILABLE (' + queuePlayable + '/3)', 512, 828);
          }
        }
        drawPackCanvasButton(ctx, pack.saved_by_me ? 'SAVED PACK' : 'SAVE PACK', 92, 884, 250, 72, true, 'save');
        drawPackCanvasButton(ctx, 'SHARE PACK', 387, 884, 250, 72, false, 'share');
        drawPackCanvasButton(ctx, 'CLOSE', 682, 884, 250, 72, false, 'close');
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 58px "Archivo", sans-serif';
        const title = mode === 'complete' ? 'PACK COMPLETE' : (mode === 'unavailable' ? 'REEL UNAVAILABLE' : String(pack.title || 'Untitled Pack'));
        wrapPackCanvasText(ctx, title, 512, 300, 820, 68, 2);
        ctx.fillStyle = '#b8c0ca';
        ctx.font = '600 25px "Archivo", sans-serif';
        const description = mode === 'complete'
          ? 'You reached the end of this authored collection.'
          : mode === 'unavailable'
            ? 'This item was removed or is inaccessible. It will be skipped.'
            : (pack.description || ('An ordered collection by ' + packCreatorLabel() + '.'));
        wrapPackCanvasText(ctx, description, 512, 465, 760, 38, 4);
        if (mode === 'complete') {
          drawPackCanvasButton(ctx, 'REPLAY PACK', 92, 720, 250, 76, true, 'replay');
          drawPackCanvasButton(ctx, 'RETURN TO PACK', 387, 720, 250, 76, false, 'return');
          drawPackCanvasButton(ctx, 'EXPLORE PACKS', 682, 720, 250, 76, false, 'explore');
        } else if (mode === 'unavailable') {
          drawPackCanvasButton(ctx, 'SKIP ITEM', 337, 720, 350, 76, true, 'skip');
        }
        const canPublishHere = !!(pack.viewer_state && pack.viewer_state.can_edit) && pack.status === 'draft' && mode === 'complete';
        if (canPublishHere) {
          const playable = videoData.filter((row) => row && row.available !== false && row.media_type !== 'static').length;
          if (playable >= 3) {
            drawPackCanvasButton(ctx, 'PUBLISH COLLECTION', 337, 822, 350, 64, false, 'publish-pack');
          } else {
            ctx.fillStyle = '#767d86';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '800 19px "JetBrains Mono", monospace';
            ctx.fillText('PUBLISH AT 3+ AVAILABLE (' + playable + '/3)', 512, 854);
          }
        }
      }
      packVisualVersion += 1;
      notifyVisualSourceChange();
    }

    function handlePackVisualSelect(point) {
      if (!isPackMode || !point) return false;
      const region = packVisualRegions.find((entry) =>
        point.u >= entry.x && point.u <= entry.x + entry.w && point.v >= entry.y && point.v <= entry.y + entry.h
      );
      if (!region) return false;
      if (region.action === 'start') startPackPlayback(false);
      else if (region.action === 'replay') startPackPlayback(true);
      else if (region.action === 'select') selectPackItem(region.index);
      else if (region.action === 'save') togglePackSave();
      else if (region.action === 'share') shareCurrentPack();
      else if (region.action === 'close') setPackQueue(false);
      else if (region.action === 'skip') nextVideo('unavailable');
      else if (region.action === 'return') returnToPack();
      else if (region.action === 'explore') dispatchNavigation('/explore?type=packs');
      else if (region.action === 'publish-pack') publishPackFromPlayer();
      return true;
    }

    async function publishPackFromPlayer() {
      const pack = packState.pack;
      if (!pack || !pack.viewer_state || !pack.viewer_state.can_edit || pack.status !== 'draft') return;
      if ((pack.playable_count ?? 0) < 3) { showFlash('NEEDS 3+ AVAILABLE REELS'); return; }
      try {
        const result = await requestJson('/api/packs/' + encodeURIComponent(pack.id) + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ expected_revision: pack.revision }),
        });
        packState.pack = { ...packState.pack, ...result.pack };
        showFlash('COLLECTION PUBLISHED');
        syncPackChrome();
      } catch (error) {
        showFlash(error.code === 'PACK_REVISION_CONFLICT' ? 'RELOAD THE PACK TO PUBLISH' : 'PUBLISH FAILED');
      }
      if (packVisualMode) renderPackVisual(packVisualMode);
    }

    function pauseCurrentPlayback() {
      const item = videoData[idx];
      if (isImageItem(item)) clearImageTimer();
      else if (video) {
        try { video.pause(); } catch (e) {}
      }
      updatePlayBtnUI(false);
    }

    function resumeCurrentPlayback() {
      if (!isPackMode || packState.phase !== 'playing' || packQueueOpen) return;
      if (isImageItem(videoData[idx])) armImageTimer();
      else if (video) video.play().catch(() => {});
    }

    function renderPackQueueDom() {
      if (!isPackMode || !packQueueList) return;
      packQueueList.replaceChildren();
      const pack = packState.pack || {};
      const title = document.getElementById('packQueueTitle');
      const creator = document.getElementById('packQueueCreator');
      if (title) title.textContent = pack.title || 'Untitled Pack';
      if (creator) creator.textContent = 'CURATED BY ' + packCreatorLabel() + ' · ' + videoData.length + ' REELS';
      videoData.forEach((item, index) => {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'reels-pack-queue-item' + (index === idx ? ' current' : '');
        row.disabled = !item || item.available === false;
        row.setAttribute('aria-current', index === idx ? 'true' : 'false');
        const number = document.createElement('span');
        number.textContent = String(index + 1).padStart(2, '0');
        const name = document.createElement('strong');
        name.textContent = row.disabled ? 'Reel unavailable' : (item.title || item.filename || 'Untitled reel');
        const status = document.createElement('span');
        status.textContent = row.disabled ? 'SKIPPED' : (index === idx ? 'NOW' : 'PLAY');
        row.append(number, name, status);
        row.addEventListener('click', () => selectPackItem(index));
        packQueueList.appendChild(row);
      });
    }

    function syncPackChrome() {
      if (!isPackMode) return;
      const pack = packState.pack || {};
      if (packModeBar) packModeBar.hidden = false;
      if (packPosition) packPosition.textContent = (videoData.length ? idx + 1 : 0) + '/' + videoData.length;
      if (packQueueBtn) packQueueBtn.title = 'Open ' + (pack.title || 'Reel Pack') + ' queue';
      const saveLabel = pack.saved_by_me ? 'SAVED PACK' : 'SAVE PACK';
      if (packSaveBtn) packSaveBtn.textContent = saveLabel;
      if (packQueueSave) packQueueSave.textContent = saveLabel;
      if (packQueuePublish) {
        const canPublish = !!(pack.viewer_state && pack.viewer_state.can_edit) && pack.status === 'draft';
        packQueuePublish.hidden = !canPublish;
      }
      if (modeBtn) modeBtn.hidden = true;
      if (notInterestedBtn) notInterestedBtn.hidden = true;
      if (hideCreatorBtn) hideCreatorBtn.hidden = true;
      renderPackQueueDom();
    }

    function showPackStage(mode) {
      if (!isPackMode || !packStageCard) return;
      // Collections play immediately — the stage card only covers terminal
      // states (pack complete) and per-item recovery (unavailable member).
      if (mode !== 'complete' && mode !== 'unavailable') {
        hidePackStage();
        return;
      }
      packQueueOpen = false;
      if (packQueuePanel) packQueuePanel.hidden = true;
      packStageCard.hidden = false;
      const pack = packState.pack || {};
      packStageSecondary.hidden = mode !== 'complete';
      packStageExplore.hidden = mode !== 'complete';
      if (mode === 'complete') {
        packStageLabel.textContent = 'REEL PACK COMPLETE';
        packStageTitle.textContent = pack.title || 'Pack complete';
        packStageText.textContent = 'You reached the end of this authored collection.';
        packStageStatus.textContent = videoData.length + ' ordered reels · no automatic feed continuation';
        packStagePrimary.textContent = 'REPLAY PACK';
        packStagePrimary.dataset.action = 'replay';
      } else {
        packStageLabel.textContent = 'PACK ITEM ' + (idx + 1) + ' OF ' + videoData.length;
        packStageTitle.textContent = 'Reel unavailable';
        packStageText.textContent = 'This reel was removed or is no longer accessible. Its place in the authored order is preserved.';
        packStageStatus.textContent = 'Skipping without exposing protected media.';
        packStagePrimary.textContent = 'SKIP ITEM';
        packStagePrimary.dataset.action = 'skip';
      }
      renderPackVisual(mode);
      syncPackChrome();
      try { packStagePrimary.focus({ preventScroll: true }); } catch (e) {
        try { packStagePrimary.focus(); } catch (ignored) {}
      }
    }

    function hidePackStage() {
      if (packStageCard) packStageCard.hidden = true;
      if (packQueuePanel) packQueuePanel.hidden = true;
      packQueueOpen = false;
      packVisualMode = '';
      notifyVisualSourceChange();
    }

    function setPackQueue(open, options) {
      if (!isPackMode) return false;
      const shouldOpen = typeof open === 'boolean' ? open : !packQueueOpen;
      if (shouldOpen) {
        const source = currentVisualSource();
        packResumeAfterOverlay = packState.phase === 'playing' && !source.paused;
        pauseCurrentPlayback();
        packQueueOpen = true;
        if (packStageCard) packStageCard.hidden = true;
        if (packQueuePanel) packQueuePanel.hidden = false;
        renderPackQueueDom();
        renderPackVisual('queue');
        try { packQueueClose.focus({ preventScroll: true }); } catch (e) {
          try { packQueueClose.focus(); } catch (ignored) {}
        }
      } else {
        packQueueOpen = false;
        if (packQueuePanel) packQueuePanel.hidden = true;
        if (packState.phase !== 'playing') showPackStage(packState.phase);
        else {
          packVisualMode = '';
          notifyVisualSourceChange();
          if ((!options || options.resume !== false) && packResumeAfterOverlay) resumeCurrentPlayback();
        }
        packResumeAfterOverlay = false;
      }
      return packQueueOpen;
    }

    function packPositionSeconds() {
      return isImageItem(videoData[idx]) ? 0 : (video && Number.isFinite(video.currentTime) ? video.currentTime : 0);
    }

    async function persistPackProgress(immediate) {
      if (!isPackMode || !currentUser || !packState.pack || !PackState) return;
      if (packProgressTimer) {
        clearTimeout(packProgressTimer);
        packProgressTimer = null;
      }
      const send = async () => {
        packState.index = idx;
        const payload = PackState.progressPayload(packState, packPositionSeconds());
        try {
          await requestJson('/api/packs/' + encodeURIComponent(packState.pack.id) + '/progress', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            keepalive: !!immediate,
          });
        } catch (error) {
          if (error.status !== 401 && error.status !== 403) console.warn('[ReelsPlayer] Pack progress save failed:', error);
        }
      };
      if (immediate) return send();
      packProgressTimer = setTimeout(send, 1200);
    }

    function schedulePackProgress() {
      if (!isPackMode || packState.phase !== 'playing' || packProgressTimer) return;
      packProgressTimer = setTimeout(() => {
        packProgressTimer = null;
        persistPackProgress(true);
      }, 2000);
    }

    function recordPackEvent(eventType, context) {
      if (!isPackMode || !packState.pack) return;
      requestJson('/api/events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event_type: eventType,
          pack_id: packState.pack.id,
          post_id: videoData[idx] && videoData[idx].post_id || null,
          source: 'pack',
          client_event_id: eventId(),
          client_occurred_at: new Date().toISOString(),
          context: { pack_item_id: videoData[idx] && videoData[idx].pack_item_id || null, ...(context || {}) },
        }),
      }).catch(() => {});
    }

    async function togglePackSave() {
      if (!isPackMode || !packState.pack) return;
      if (!currentUser) {
        requestAuthentication({ kind: 'pack-save', pack_id: packState.pack.id });
        return;
      }
      const wasSaved = !!packState.pack.saved_by_me;
      packState.pack.saved_by_me = !wasSaved;
      syncPackChrome();
      if (packVisualMode) renderPackVisual(packVisualMode);
      try {
        const result = await requestJson('/api/packs/' + encodeURIComponent(packState.pack.id) + '/save', {
          method: wasSaved ? 'DELETE' : 'PUT',
        });
        packState.pack.saved_by_me = !!result.saved;
        packState.pack.saves = result.saves;
      } catch (error) {
        packState.pack.saved_by_me = wasSaved;
        if (error.status === 401 || error.status === 403) requestAuthentication({ kind: 'pack-save', pack_id: packState.pack.id });
        else showFlash('PACK SAVE FAILED');
      }
      syncPackChrome();
      if (packVisualMode) renderPackVisual(packVisualMode);
    }

    async function shareCurrentPack() {
      if (!isPackMode || !packState.pack) return;
      pauseCurrentPlayback();
      await persistPackProgress(true);
      recordPackEvent('pack_share');
      try { if (typeof WebXRVR !== 'undefined' && WebXRVR.exitVR) await WebXRVR.exitVR(); } catch (e) {}
      const detail = { kind: 'pack', id: packState.pack.id, pack_id: packState.pack.id, title: packState.pack.title || 'Reel Pack' };
      window.dispatchEvent(new CustomEvent('echo:share-pack', { detail }));
      try { if (window.top && window.top !== window) window.top.dispatchEvent(new CustomEvent('echo:share-pack', { detail })); } catch (e) {}
    }

    function returnToPack() {
      if (!isPackMode || !packState.pack) return;
      persistPackProgress(true);
      dispatchNavigation('/packs/' + encodeURIComponent(packState.pack.id));
    }

    function startPackPlayback(replay) {
      if (!isPackMode || !PackState) return;
      if (packUnavailableTimer) clearTimeout(packUnavailableTimer);
      const resumePositionMs = replay ? 0 : Math.max(0, Number(packState.resumePositionMs) || 0);
      packState = PackState.transition(packState, { type: replay ? 'REPLAY' : 'START' });
      idx = packState.index;
      if (packState.phase !== 'playing') {
        showPackStage('complete');
        return;
      }
      hidePackStage();
      loadVideo(idx, { autoplay: true, seekTo: resumePositionMs / 1000 });
      recordPackEvent(replay ? 'pack_start' : (resumePositionMs > 0 ? 'pack_resume' : 'pack_start'));
      persistPackProgress(true);
    }

    function selectPackItem(index) {
      if (!isPackMode || !PackState) return;
      if (packUnavailableTimer) {
        clearTimeout(packUnavailableTimer);
        packUnavailableTimer = null;
      }
      const nextState = PackState.transition(packState, { type: 'SELECT', index });
      if (nextState === packState) return;
      packState = nextState;
      idx = packState.index;
      setPackQueue(false, { resume: false });
      hidePackStage();
      loadVideo(idx, { autoplay: true });
      persistPackProgress(true);
    }

    function completePack() {
      if (!isPackMode || !PackState) return;
      pauseCurrentPlayback();
      packState = PackState.transition(packState, { type: 'COMPLETE' });
      showPackStage('complete');
      persistPackProgress(true);
      recordPackEvent('pack_complete', { reel_count: videoData.length });
    }

    // ── Save to collection (2D DOM menu + XR static card) ──
    function collectPresenting() {
      try { return !!(typeof WebXRVR !== 'undefined' && WebXRVR.isPresenting && WebXRVR.isPresenting()); } catch (e) { return false; }
    }

    async function loadCollectRows() {
      const result = await requestJson('/api/users/me/packs');
      collectRows = (result.items || [])
        .filter((row) => row.status === 'draft')
        .map((row) => ({ id: row.id, title: row.title || 'Untitled Collection', count: row.reel_count || 0, added: false }));
    }

    async function openCollectOverlay() {
      const item = videoData[idx];
      if (!item || !item.post_id) { showFlash('NOTHING TO COLLECT'); return false; }
      if (collectOpen) { closeCollectOverlay(); return false; }
      if (!currentUser) {
        requestAuthentication({ kind: 'collect', post_id: item.post_id });
        return false;
      }
      collectPostId = item.post_id;
      collectWasPlaying = isImageItem(item) ? !!imageTimer : !!(video && !video.paused);
      pauseCurrentPlayback();
      collectOpen = true;
      try {
        await loadCollectRows();
      } catch (error) {
        collectOpen = false;
        collectPostId = null;
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({ kind: 'collect', post_id: item.post_id });
        } else {
          showFlash('COLLECTIONS UNAVAILABLE');
        }
        return false;
      }
      renderCollectVisual();
      if (!collectPresenting() && collectMenuPanel) {
        renderCollectMenuDom();
        if (collectMenuBackdrop) collectMenuBackdrop.hidden = false;
        collectMenuPanel.hidden = false;
        // The edge nav is a page-level sibling of the frame, so the class
        // goes on body as well to hide it while the modal is up.
        if (frame) frame.classList.add('sx-collect-open');
        document.body.classList.add('sx-collect-open');
        try { collectMenuClose.focus({ preventScroll: true }); } catch (e) {
          try { collectMenuClose.focus(); } catch (ignored) {}
        }
      }
      return true;
    }

    function closeCollectOverlay() {
      if (!collectOpen) return;
      collectOpen = false;
      collectPostId = null;
      packVisualMode = '';
      if (collectMenuPanel) collectMenuPanel.hidden = true;
      if (collectMenuBackdrop) collectMenuBackdrop.hidden = true;
      if (frame) frame.classList.remove('sx-collect-open');
      document.body.classList.remove('sx-collect-open');
      hideCollectNewRow();
      notifyVisualSourceChange();
      if (isPackMode) resumeCurrentPlayback();
      else if (collectWasPlaying) {
        const item = videoData[idx];
        if (isImageItem(item)) armImageTimer();
        else if (video) video.play().catch(() => {});
        updatePlayBtnUI(true);
      }
      collectWasPlaying = false;
    }

    function hideCollectNewRow() {
      if (collectNewRow) collectNewRow.hidden = true;
      if (collectNewName) collectNewName.value = '';
    }

    // Instagram-style save: a collection pick also keeps the reel in All
    // saved items.
    async function ensureGeneralSaved() {
      const item = videoData[idx];
      if (!item || !item.post_id || item._saved) return;
      await saveCurrentReel();
    }

    function renderCollectMenuDom() {
      if (!collectMenuList) return;
      collectMenuList.replaceChildren();
      const item = videoData[idx];
      const generalRow = document.createElement('button');
      generalRow.type = 'button';
      generalRow.className = 'reels-pack-queue-item' + (item && item._saved ? ' current' : '');
      generalRow.setAttribute('aria-label', item && item._saved ? 'Saved to all saved items — tap to remove' : 'Save to all saved items');
      const gMark = document.createElement('span');
      gMark.textContent = '∞';
      const gName = document.createElement('strong');
      gName.textContent = 'ALL SAVED ITEMS';
      const gStatus = document.createElement('span');
      gStatus.textContent = item && item._saved ? 'SAVED' : 'SAVE';
      generalRow.append(gMark, gName, gStatus);
      generalRow.addEventListener('click', async () => {
        await saveCurrentReel();
        renderCollectMenuDom();
      });
      collectMenuList.appendChild(generalRow);
      if (!collectRows.length) {
        const empty = document.createElement('p');
        empty.className = 'reels-pack-queue-empty';
        empty.textContent = 'No collections yet — create one below.';
        collectMenuList.appendChild(empty);
      }
      collectRows.forEach((row) => {
        const rowBtn = document.createElement('button');
        rowBtn.type = 'button';
        rowBtn.className = 'reels-pack-queue-item' + (row.added ? ' current' : '');
        rowBtn.disabled = !!row.added;
        rowBtn.setAttribute('aria-label', (row.added ? 'Added to ' : 'Add to collection ') + row.title);
        const count = document.createElement('span');
        count.textContent = String(row.count).padStart(2, '0');
        const name = document.createElement('strong');
        name.textContent = row.title;
        const status = document.createElement('span');
        status.textContent = row.added ? 'ADDED' : 'ADD';
        rowBtn.append(count, name, status);
        rowBtn.addEventListener('click', () => addReelToCollection(row.id, row));
        collectMenuList.appendChild(rowBtn);
      });
    }

    async function addReelToCollection(packId, row) {
      if (!collectPostId || !packId) return;
      await ensureGeneralSaved();
      try {
        const result = await requestJson('/api/packs/' + encodeURIComponent(packId) + '/items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ post_id: collectPostId }),
        });
        if (row) { row.added = true; row.count = result.pack ? result.pack.reel_count : row.count + 1; }
        requestJson('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event_type: 'collection_add',
            post_id: collectPostId,
            pack_id: packId,
            source: 'collection',
            client_event_id: eventId(),
            client_occurred_at: new Date().toISOString(),
          }),
        }).catch(() => {});
        showFlash('ADDED TO COLLECTION');
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({ kind: 'collect', post_id: collectPostId });
        } else {
          showFlash(error.code === 'PACK_TOO_LARGE' ? 'COLLECTION FULL (30)' : 'COLLECTION ADD FAILED');
        }
      }
      if (collectOpen) {
        renderCollectVisual();
        if (!collectPresenting()) renderCollectMenuDom();
      }
    }

    async function createCollectionFromCurrentReel(title) {
      if (!collectPostId) return;
      const name = (typeof title === 'string' ? title : '').trim() || 'New Collection';
      try {
        const result = await requestJson('/api/packs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: name, post_ids: [collectPostId] }),
        });
        const pack = result.pack;
        collectRows.unshift({ id: pack.id, title: pack.title || name, count: pack.reel_count || 1, added: true });
        await ensureGeneralSaved();
        showFlash('SAVED TO ' + name.toUpperCase().slice(0, 26));
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({ kind: 'collect', post_id: collectPostId });
        } else {
          showFlash('COULD NOT CREATE COLLECTION');
        }
      }
      if (collectOpen) {
        renderCollectVisual();
        if (!collectPresenting()) renderCollectMenuDom();
      }
    }

    function submitCollectNew() {
      const name = collectNewName ? collectNewName.value : '';
      hideCollectNewRow();
      createCollectionFromCurrentReel(name);
    }

    function renderCollectVisual() {
      if (!packVisualCanvas) return;
      packVisualMode = 'collect';
      packVisualRegions = [];
      const ctx = packVisualCanvas.getContext('2d');
      ctx.clearRect(0, 0, 1024, 1024);
      const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
      gradient.addColorStop(0, '#1c0d0b');
      gradient.addColorStop(0.48, '#09101c');
      gradient.addColorStop(1, '#05080e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 1024, 1024);
      ctx.strokeStyle = '#ff553a';
      ctx.lineWidth = 5;
      ctx.strokeRect(34, 34, 956, 956);
      ctx.fillStyle = '#ff765f';
      ctx.font = '900 24px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('SAVE TO COLLECTION', 512, 104);
      const item = videoData[idx];
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 38px "Archivo", sans-serif';
      ctx.fillText(String((item && (item.title || item.filename)) || 'This reel').slice(0, 40), 512, 160);
      const shown = collectRows.slice(0, 7);
      const rowX = 92, rowW = 840, rowH = 56, rowGap = 8, rowStart = 220;
      shown.forEach((row, index) => {
        const y = rowStart + index * (rowH + rowGap);
        ctx.fillStyle = row.added ? '#14251c' : '#11161d';
        ctx.strokeStyle = row.added ? '#4ade80' : '#303945';
        ctx.lineWidth = row.added ? 3 : 1;
        ctx.beginPath();
        ctx.roundRect(rowX, y, rowW, rowH, 6);
        ctx.fill();
        ctx.stroke();
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = '700 22px "Archivo", sans-serif';
        ctx.fillText(String(row.title).slice(0, 42), rowX + 22, y + rowH / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = row.added ? '#4ade80' : '#aeb7c3';
        ctx.font = '800 17px "JetBrains Mono", monospace';
        ctx.fillText(row.added ? 'ADDED' : 'ADD', rowX + rowW - 22, y + rowH / 2);
        if (!row.added) addPackVisualRegion('collect-pack', rowX, y, rowW, rowH, { packId: row.id, row });
      });
      if (collectRows.length > shown.length) {
        ctx.fillStyle = '#aeb7c3';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        ctx.font = '700 18px "JetBrains Mono", monospace';
        ctx.fillText('+' + (collectRows.length - shown.length) + ' MORE · SEE ALL IN 2D', 512, rowStart + shown.length * (rowH + rowGap) + 12);
      }
      drawPackCanvasButton(ctx, '+ NEW COLLECTION', 92, 884, 250, 72, false, 'collect-new');
      drawPackCanvasButton(ctx, 'ALL SAVED', 387, 884, 250, 72, true, 'collect-just-save');
      drawPackCanvasButton(ctx, 'CLOSE', 682, 884, 250, 72, false, 'collect-close');
      packVisualVersion += 1;
      notifyVisualSourceChange();
    }

    function handleCollectSelect(point) {
      if (!collectOpen || !point) return false;
      const region = packVisualRegions.find((entry) =>
        point.u >= entry.x && point.u <= entry.x + entry.w && point.v >= entry.y && point.v <= entry.y + entry.h
      );
      if (!region) return false;
      if (region.action === 'collect-just-save') { closeCollectOverlay(); saveCurrentReel(); }
      else if (region.action === 'collect-pack') addReelToCollection(region.packId, region.row);
      else if (region.action === 'collect-new') createCollectionFromCurrentReel();
      else if (region.action === 'collect-close') closeCollectOverlay();
      return true;
    }

    function handleCardSelect(point) {
      if (collectOpen) return handleCollectSelect(point);
      return handlePackVisualSelect(point);
    }

    function showRewardToast(message, award) {
      if (!rewardToast || !message) return;
      rewardToast.textContent = message;
      rewardToast.classList.toggle('award', !!award);
      rewardToast.classList.add('show');
      if (rewardToastTimer) clearTimeout(rewardToastTimer);
      rewardToastTimer = setTimeout(() => rewardToast.classList.remove('show'), award ? 4200 : 2600);
    }

    function showRewardProgress(result) {
      if (!result) return;
      const message = window.ReelsRewards && window.ReelsRewards.progressMessage
        ? window.ReelsRewards.progressMessage(result)
        : (result.credit_awarded ? '+1 ECHO CREDIT' : String(result.progress || 0) + '/10 TO NEXT CREDIT');
      showRewardToast(message, result.credit_awarded);
      if (!result.credit_awarded) return;
      const detail = { ...result, type: 'echo:credits-awarded' };
      window.dispatchEvent(new CustomEvent('echo:credits-awarded', { detail }));
      try {
        if (window.parent && window.parent !== window) window.parent.postMessage(detail, location.origin);
      } catch (e) {}
      if (typeof WebXRVR !== 'undefined' && WebXRVR.showNotification) {
        WebXRVR.showNotification(message);
      }
    }

    async function maybeClaimReelReward(state) {
      if (!state || state.finished || state.rewardClaimSent || !currentUser) return;
      const impressionId = recommendationImpressionId(state.item);
      if (!impressionId) return;
      const measurements = playbackMeasurements(state.item, state);
      const threshold = window.ReelsRewards && window.ReelsRewards.thresholdMs
        ? window.ReelsRewards.thresholdMs(state.item.media_type, measurements.duration_ms)
        : null;
      if (!threshold || state.watchMs < threshold) return;
      state.rewardClaimSent = true;
      try {
        await requestJson('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event_type: 'reward_eligible',
            post_id: state.item.post_id,
            watch_ms: Math.round(state.watchMs),
            foreground_ms: measurements.foreground_ms,
            duration_ms: measurements.duration_ms,
            watch_ratio: measurements.watch_ratio,
            position_ms: isImageItem(state.item) ? null : Math.round((video.currentTime || 0) * 1000),
            pack_id: isPackMode && packState.pack ? packState.pack.id : null,
            source: analyticsSource,
            client_event_id: state.rewardEventId,
            client_occurred_at: new Date().toISOString(),
            recommendation_impression_id: impressionId,
            playback_quality: measurements.playback_quality,
            context: { media_type: state.item.media_type || 'video', reward_threshold_ms: threshold },
          }),
        });
        const result = await requestJson('/api/rewards/reels/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            post_id: state.item.post_id,
            recommendation_impression_id: impressionId,
          }),
        });
        showRewardProgress(result);
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
        } else if (error.status === 409 || error.code === 'REWARD_ALREADY_CLAIMED') {
          // Terminal duplicate: this reel already counted. Informative, no retry.
          showRewardToast('ALREADY CLAIMED FOR THIS REEL', false);
        } else if (!error.status || error.status >= 500 || error.status === 429 || error.code === 'REWARD_RETRYABLE') {
          // Transient (network / 5xx / rate-limit / busy): retry after backoff.
          const delay = error.status === 429 ? 5000 : 2000;
          setTimeout(() => {
            if (viewTracker === state && !state.finished) state.rewardClaimSent = false;
          }, delay);
        } else {
          // Other 4xx (validation / telemetry timing): the server event may
          // land just after the claim — allow up to 2 retries with backoff,
          // then surface feedback instead of silently dropping the view.
          state.rewardClaimAttempts = (state.rewardClaimAttempts || 0) + 1;
          if (state.rewardClaimAttempts <= 2) {
            setTimeout(() => {
              if (viewTracker === state && !state.finished) state.rewardClaimSent = false;
            }, 4000);
          } else {
            showRewardToast('REWARD NOT ELIGIBLE YET', false);
          }
        }
      }
    }

    function recommendationImpressionId(item) {
      return item && item.recommendation && item.recommendation.impression_id
        ? item.recommendation.impression_id
        : null;
    }

    function recommendationHeaders(item, headers) {
      const result = { ...(headers || {}) };
      const impressionId = recommendationImpressionId(item);
      if (impressionId) result['X-Recommendation-Impression-Id'] = impressionId;
      return result;
    }

    function feedRequestUrl(cursor, params) {
      const url = new URL('/api/reels/feed', location.origin);
      Object.entries(params || feedParams).forEach(([key, value]) => {
        if (value !== null && value !== undefined && value !== '') {
          url.searchParams.set(key, String(value));
        }
      });
      if (cursor) url.searchParams.set('cursor', cursor);
      return url.pathname + url.search;
    }

    function abortFeedWork() {
      feedGeneration = FeedState.nextGeneration(feedGeneration);
      if (feedRequestController) feedRequestController.abort();
      if (feedTransitionController) feedTransitionController.abort();
      if (preloadController) preloadController.abort();
      feedRequestController = null;
      feedTransitionController = null;
      preloadController = null;
      feedPromise = null;
      isPreloading = false;
      clearPreloadVideo();
    }

    function clearBlobCache() {
      clearPreloadVideo();
      Object.keys(blobUrlMap).forEach((key) => {
        try { URL.revokeObjectURL(blobUrlMap[key]); } catch (e) {}
        delete blobUrlMap[key];
      });
    }

    function pruneBlobCache(currentIndex) {
      const keep = new Set([currentIndex, currentIndex + 1, currentIndex + 2].map(String));
      Object.keys(blobUrlMap).forEach((key) => {
        if (keep.has(key)) return;
        try { URL.revokeObjectURL(blobUrlMap[key]); } catch (e) {}
        delete blobUrlMap[key];
      });
    }

    async function fetchNextPage() {
      if (isPackMode) return 0;
      if (!feedHasMore || !feedCursor) return 0;
      if (feedPromise) return feedPromise;
      const generation = feedGeneration;
      feedRequestController = typeof AbortController !== 'undefined' ? new AbortController() : null;
      feedPromise = (async () => {
        try {
          const page = await requestJson(feedRequestUrl(feedCursor), {
            signal: feedRequestController ? feedRequestController.signal : undefined,
          });
          if (!FeedState.isCurrent(generation, feedGeneration)) return 0;
          const seen = new Set(videoData.map((item) => item.post_id || item.path));
          const additions = (page.items || []).filter((item) => {
            const key = item.post_id || item.path;
            if (!key || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
          videoData.push(...additions);
          feedCursor = page.next_cursor || null;
          feedHasMore = !!page.has_more && !!feedCursor;
          if (counter) counter.textContent = (idx + 1) + ' / ' + videoData.length + (feedHasMore ? '+' : '');
          if (additions.length) preloadNext(idx);
          return additions.length;
        } catch (error) {
          if (error && error.name === 'AbortError') return 0;
          console.error('[ReelsPlayer] Next recommendation page failed:', error);
          showFlash('FEED RETRY');
          return 0;
        } finally {
          if (FeedState.isCurrent(generation, feedGeneration)) {
            feedPromise = null;
            feedRequestController = null;
          }
        }
      })();
      return feedPromise;
    }

    function maybeFetchMore() {
      if (isPackMode) return;
      const remaining = videoData.length - idx - 1;
      if (feedHasMore && remaining <= 4) fetchNextPage();
    }

    async function leaveImmersiveModes() {
      try {
        if (typeof WebXRVR !== 'undefined' && WebXRVR.exitVR) {
          await WebXRVR.exitVR();
        }
      } catch (e) {}
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          await document.exitFullscreen();
        }
      } catch (e) {}
    }

    function returnPathForItem(item) {
      if (isPackMode && packState.pack) {
        return '/packs/' + encodeURIComponent(packState.pack.id) + '?play=1&item=' + idx;
      }
      let path = location.pathname + location.search;
      if (location.pathname.indexOf('/api/reels/player') === 0) path = '/reels';
      try {
        const url = new URL(path, location.origin);
        if (item && item.path) url.searchParams.set('play', item.path);
        return url.pathname + url.search;
      } catch (e) {
        return '/reels';
      }
    }

    async function dispatchNavigation(path) {
      if (isPackMode) {
        pauseCurrentPlayback();
        await persistPackProgress(true);
      }
      await leaveImmersiveModes();
      const event = new CustomEvent('echo:navigate', {
        detail: { path: path },
        cancelable: true,
      });
      const shouldFallback = window.dispatchEvent(event);
      if (shouldFallback) location.assign(path);
    }

    async function requestAuthentication(action) {
      const item = videoData[idx] || null;
      const pending = {
        ...(action || {}),
        post_id: action && action.post_id ? action.post_id : (item && item.post_id),
        path: item && item.path,
        created_at: Date.now(),
      };
      try { sessionStorage.setItem('echo:pending-action', JSON.stringify(pending)); } catch (e) {}
      const next = returnPathForItem(item);
      await leaveImmersiveModes();
      const event = new CustomEvent('echo:auth-required', {
        detail: { next: next, action: pending.kind || 'interact' },
        cancelable: true,
      });
      const shouldFallback = window.dispatchEvent(event);
      if (shouldFallback) location.assign('/login?next=' + encodeURIComponent(next));
    }

    function openProfile(username) {
      if (!username) return;
      const item = videoData[idx];
      if (item && item.creator && item.creator.username === username) {
        requestJson('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            event_type: 'profile_open',
            post_id: item.post_id,
            pack_id: isPackMode && packState.pack ? packState.pack.id : null,
            source: analyticsSource,
            client_event_id: eventId(),
            recommendation_impression_id: recommendationImpressionId(item),
            client_occurred_at: new Date().toISOString(),
            context: { target_user_id: item.creator.id },
          }),
        }).catch(() => {});
      }
      dispatchNavigation('/profile/' + encodeURIComponent(username));
    }

    function refreshAccountUI() {
      if (!accountBtn || !accountAvatar || !accountName) return;
      accountAvatar.textContent = '';
      if (currentUser) {
        if (currentUser.avatar_url) {
          const image = document.createElement('img');
          image.src = currentUser.avatar_url;
          image.alt = '';
          accountAvatar.appendChild(image);
        } else {
          accountAvatar.textContent = (currentUser.display_name || currentUser.username || '?').slice(0, 1).toUpperCase();
        }
        accountName.textContent = '@' + currentUser.username;
        accountBtn.title = 'Open your profile';
        if (commentSubmitBtn) commentSubmitBtn.textContent = 'SEND';
      } else {
        accountAvatar.textContent = '?';
        accountName.textContent = 'SIGN IN';
        accountBtn.title = 'Sign in to interact';
        if (commentSubmitBtn) commentSubmitBtn.textContent = 'SIGN IN';
      }
    }

    async function replayPendingAction() {
      if (!currentUser || pendingReplayAttempted) return;
      pendingReplayAttempted = true;
      let pending = null;
      try { pending = JSON.parse(sessionStorage.getItem('echo:pending-action') || 'null'); } catch (e) {}
      if (!pending || !pending.kind || Date.now() - Number(pending.created_at || 0) > 10 * 60 * 1000) {
        try { sessionStorage.removeItem('echo:pending-action'); } catch (e) {}
        return;
      }
      if (pending.kind === 'pack-save' && isPackMode && packState.pack && pending.pack_id === packState.pack.id) {
        try { sessionStorage.removeItem('echo:pending-action'); } catch (e) {}
        await togglePackSave();
        return;
      }
      const targetIndex = videoData.findIndex((item) =>
        (pending.post_id && item.post_id === pending.post_id) ||
        (pending.path && item.path === pending.path)
      );
      if (targetIndex < 0) return;
      try { sessionStorage.removeItem('echo:pending-action'); } catch (e) {}
      if (targetIndex !== idx) loadVideo(targetIndex);
      if (pending.kind === 'like') await likeCurrentReel();
      else if (pending.kind === 'save') await saveCurrentReel();
      else if (pending.kind === 'collect') await openCollectOverlay();
      else if (pending.kind === 'follow') await followCurrentCreator();
      else if (pending.kind === 'comment' && pending.text) {
        const posted = await postComment(pending.text, pending.timestamp);
        if (posted && commentInput) commentInput.value = '';
      } else if (pending.kind === 'comment-like' && pending.comment_id) {
        await likeComment(pending.comment_id);
      }
    }

    async function loadCurrentUser() {
      try {
        const result = await requestJson('/api/auth/me');
        currentUser = result && result.user ? result.user : null;
      } catch (e) {
        currentUser = null;
      }
      refreshAccountUI();
      refreshEngagementUI();
      if (currentUser) setTimeout(() => replayPendingAction(), 0);
      if (currentUser && isPackMode && packState.phase === 'playing') schedulePackProgress();

    // Compact engagement counts (1250 -> "1.2K").
    function fmtCount(n) {
      n = Number(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
      return String(n);
    }

    // Architectural ocular-aperture view icon — injected server-side from
    // the shared icons folder (see __ICON_VIEW__ token).
    const VIEW_SVG = '__ICON_VIEW__';

    function refreshEngagementUI() {
      const item = videoData[idx];
      if (likeCount) likeCount.textContent = fmtCount(item && item.likes);
      if (metaViews) metaViews.innerHTML = VIEW_SVG + '<span>' + fmtCount(item && item.views) + '</span>';
      if (!item) return;

      if (item._liked === undefined) {
        item._liked = !!(item.viewer_state ? item.viewer_state.liked : item.liked_by_me);
      }
      if (item._saved === undefined) {
        item._saved = !!(item.viewer_state ? item.viewer_state.saved : item.saved_by_me);
      }
      if (item._following === undefined) {
        item._following = !!(item.viewer_state && item.viewer_state.following_creator);
      }

      if (likeBtn) likeBtn.classList.toggle('active', item._liked);
      if (saveBtn) {
        saveBtn.classList.toggle('active', item._saved);
        saveBtn.title = item._saved ? 'Remove from saved posts' : 'Save post';
      }

      const creator = item.creator || null;
      if (metaCreator) {
        if (creator && creator.username) {
          metaCreator.hidden = false;
          metaCreator.textContent = '@' + creator.username + (creator.display_name ? ' · ' + creator.display_name : '');
          metaCreator.title = 'Open @' + creator.username + ' profile';
        } else {
          metaCreator.hidden = true;
          metaCreator.textContent = '';
        }
      }
      const isOwnPost = !!(
        (item.viewer_state && item.viewer_state.can_edit) ||
        (creator && currentUser && creator.id === currentUser.id)
      );
      if (followBtn) {
        followBtn.hidden = !creator || !creator.username || isOwnPost;
        followBtn.classList.toggle('active', !!item._following);
        followBtn.title = item._following ? 'Unfollow creator' : 'Follow creator';
      }
      if (followPill) {
        followPill.hidden = !creator || !creator.username || isOwnPost;
        followPill.classList.toggle('active', !!item._following);
        followPill.title = item._following ? 'Unfollow creator' : 'Follow creator';
        const pillLabel = document.getElementById('followPillLabel');
        if (pillLabel) pillLabel.textContent = item._following ? 'FOLLOWING' : 'FOLLOW';
      }
      if (reportBtn) reportBtn.hidden = isOwnPost || !item.post_id;
      if (notInterestedBtn) notInterestedBtn.hidden = isPackMode || !item.post_id;
      if (hideCreatorBtn) hideCreatorBtn.hidden = isPackMode || !creator || isOwnPost;
      if (followLabel) followLabel.textContent = item._following ? 'FOLLOWING' : 'FOLLOW';
      if (isPackMode) syncPackChrome();
    }

    async function likeCurrentReel() {
      const item = videoData[idx];
      if (!item || !item.post_id) return;
      if (!currentUser) {
        requestAuthentication({ kind: 'like', post_id: item.post_id });
        return;
      }
      const wasLiked = !!item._liked;
      item._liked = !wasLiked;
      item.likes = Math.max(0, (Number(item.likes) || 0) + (item._liked ? 1 : -1));
      refreshEngagementUI();
      if (likeBtn) {
        likeBtn.classList.add('flash-click');
        setTimeout(() => likeBtn.classList.remove('flash-click'), 180);
      }
      try {
        const result = await requestJson('/api/posts/' + encodeURIComponent(item.post_id) + '/like', {
          method: item._liked ? 'PUT' : 'DELETE',
          headers: recommendationHeaders(item),
        });
        item.likes = result.likes;
        item._liked = !!result.liked;
      } catch (error) {
        item._liked = wasLiked;
        item.likes = Math.max(0, (Number(item.likes) || 0) + (wasLiked ? 1 : -1));
        if (error.status === 401 || error.status === 403) {
          currentUser = null;
          refreshAccountUI();
          requestAuthentication({ kind: 'like', post_id: item.post_id });
        } else {
          showFlash('LIKE FAILED');
        }
      }
      refreshEngagementUI();
    }

      const item = videoData[idx];
      if (!item || !item.post_id) return;

        await requestJson('/api/recommendations/feedback', {
