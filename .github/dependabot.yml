# Weekly dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem; majors come as separate PRs so they can be reviewed on their own.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    target-branch: 3dreels
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    target-branch: 3dreels
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: 3dreels
    groups:
      actions:
        update-types: [minor, patch]
