name: CI

on:
  push:
    branches: [main, dev, 3dreels]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled, except on main: a run there may be mid-deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python deps into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Install web deps
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: make test
        run: make test

  postgres:
    name: migrations + pool + recommendation tests on PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echo
          POSTGRES_PASSWORD: echo
          POSTGRES_DB: echo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echo -d echo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: echo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python deps into .venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://echo:echo@localhost:5432/echo
        run: .venv/bin/python -m alembic upgrade head
      - name: Create throwaway database for the PostgreSQL tests
        run: psql -h localhost -U echo -d echo -c "CREATE DATABASE pool_test"
      - name: Pool isolation test on PostgreSQL
        env:
          SX_TEST_POSTGRES_URL: postgresql+psycopg://echo:echo@localhost:5432/pool_test
        run: .venv/bin/python -m pytest -q tests/test_db_pool_isolation.py
      - name: Recommendation concurrency tests on PostgreSQL
        # Reuses pool_test (tables dropped and recreated per test); runs after
        # the pool step, never in parallel with it.
        env:
          SX_TEST_POSTGRES_URL: postgresql+psycopg://echo:echo@localhost:5432/pool_test
        run: .venv/bin/python -m pytest -q tests/test_recommendations.py -k concurrent
      - name: Shared rate limit on PostgreSQL
        # The limit the read-only processes share is one conditional INSERT;
        # SQLite and PostgreSQL report its result differently.
        env:
          SX_TEST_POSTGRES_URL: postgresql+psycopg://echo:echo@localhost:5432/pool_test
        run: .venv/bin/python -m pytest -q tests/test_rate_limiter.py -k shared

  docker:
    name: image build + contents check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t echo-app:ci .
      - name: Assert image contents
        run: |
          set -euo pipefail
          run() { docker run --rm --entrypoint sh echo-app:ci -c "$1"; }
          # Nothing from tests/, video/ or a local .env may be baked in.
          run 'for p in /app/tests /app/video /app/.env /app/web/node_modules; do
                 if [ -e "$p" ]; then echo "unexpected in image: $p" >&2; exit 1; fi
               done'
          # data/ and output/ exist (volume mount points owned by the app
          # user) but must ship empty.
          run 'for d in /app/data /app/output; do
                 [ -d "$d" ] || { echo "missing $d" >&2; exit 1; }
                 if [ -n "$(ls -A "$d")" ]; then echo "$d is not empty:" >&2; ls -A "$d" >&2; exit 1; fi
               done'
          run 'test -f /app/server/static/index.html'
          run 'uid=$(id -u); [ "$uid" != 0 ] || { echo "image runs as root" >&2; exit 1; }'
          run 'ffmpeg -version | head -1'
          # The base image is pinned, so a different ffmpeg major means the
          # pin was bumped without re-checking the encode settings.
          run 'ffmpeg -version | head -1 | grep -E "^ffmpeg version (7:)?7\."'
          run 'test "$(ls /app/ui)" = assets'
          run 'test "$(command -v ffmpeg)" = /usr/local/bin/ffmpeg'
          echo "image contents OK"
      - name: Trivy image scan (fixable HIGH and CRITICAL)
        # Release binary pinned by sha256, not trivy-action or `latest`: Trivy
        # 0.69.4-0.69.6 and the trivy-action/setup-trivy tags were malicious in
        # March 2026 (GHSA-69fq-xp46-6x23). Unfixed Debian CVEs are skipped;
        # to accept a fixable one, list its ID in a .trivyignore with a comment
        # saying why and when to revisit.
        env:
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
        run: |
          set -euo pipefail
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $f" | sha256sum -c -
          tar xzf "$f" trivy
          ./trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed echo-app:ci

  scans:
    name: dependency + secret scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans the full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: pip-audit (runtime requirements)
        # No ignores today. To accept a finding that has no fix yet, add
        # `--ignore-vuln <ID>` here with a comment saying why and when to revisit.
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt
      - name: npm audit (production deps, high and above)
        run: npm audit --audit-level=high --omit=dev
        working-directory: web
      - name: gitleaks (full history)
        # Release binary with its checksum checked; triaged false positives
        # live in .gitleaks.toml and .gitleaksignore.
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/$f"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$f" gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  deploy:
    name: deploy to the VPS
    # Pushes to main only, and only once every check above has passed. dev and
    # pull requests get the checks without a deploy.
    needs: [test, postgres, docker, scans]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Own group, never cancelled: a newer push must queue behind a deploy that
    # is mid-restart instead of killing it halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy over SSH
        # Secrets (Settings > Secrets and variables > Actions): VPS_HOST,
        # VPS_USER, VPS_SSH_KEY (private key of a deploy-only user in the
        # docker group), VPS_KNOWN_HOSTS (the output of `ssh-keyscan` for the
        # host, so the server's key is pinned and never trusted on first use).
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- $GITHUB_SHA" < deploy/deploy.sh | tee deploy.log
          # The script prints this line only after /api/readyz answers on the new build.
          grep -q '^deployed ' deploy.log
